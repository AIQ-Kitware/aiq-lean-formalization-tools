<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>:root{color-scheme:light dark;--b:#8885;--m:#777}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--b);position:sticky;top:0;background:Canvas;z-index:5}h1{margin:0;font-size:22px}main{padding:20px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card,details{border:1px solid var(--b);border-radius:8px;padding:10px 12px}.big{font-size:26px;font-weight:700}.muted{color:var(--m)}section{margin:26px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select{padding:7px;border:1px solid var(--b);border-radius:6px;background:Canvas;color:CanvasText}input{min-width:260px}details{margin:8px 0}summary{cursor:pointer;font-weight:600}.row{padding:8px 0;border-top:1px solid var(--b)}code{font-family:ui-monospace,monospace}</style></head><body><header><h1>Literature and source inventory</h1><div class="muted" id="purpose"></div></header><main><div class="cards" id="cards"></div><section><h2>Works</h2><div class="filters"><input id="search" type="search" placeholder="filter works"><select id="group"><option value="">all groups</option></select><select id="status"><option value="">all statuses</option></select></div><div id="works"></div></section></main><script type="application/json" id="payload">__PAYLOAD__</script><script>
const d=JSON.parse(document.getElementById('payload').textContent),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s=d.summary,raw=d.data;document.getElementById('purpose').textContent=raw.purpose||s.title;const cards=[['works',s.works],['groups',Object.keys(s.groups||{}).length],['roles',Object.keys(s.roles||{}).length],['needs bibliographic review',s.bibliographic_status?.needs_verification||0]];document.getElementById('cards').innerHTML=cards.map(([k,v])=>`<div class="card"><div class="big">${e(v)}</div><div class="muted">${e(k)}</div></div>`).join('');const works=Object.entries(raw.works||{}).map(([id,w])=>({id,...w}));const group=document.getElementById('group'),status=document.getElementById('status');Object.keys(s.groups||{}).forEach(k=>group.insertAdjacentHTML('beforeend',`<option>${e(k)}</option>`));Object.keys(s.distilled_status||{}).forEach(k=>status.insertAdjacentHTML('beforeend',`<option>${e(k)}</option>`));const search=document.getElementById('search'),out=document.getElementById('works');function render(){const q=search.value.toLowerCase(),g=group.value,st=status.value;out.innerHTML=works.filter(w=>(!g||w.group===g)&&(!st||w.distilled_status===st)&&(!q||JSON.stringify(w).toLowerCase().includes(q))).map(w=>`<details><summary><code>${e(w.id)}</code> ${e(w.title)} <span class="muted">${e(w.year)}</span></summary><div class="row"><b>Role.</b> <code>${e(w.role)}</code> · <b>priority.</b> <code>${e(w.priority)}</code> · <b>asset.</b> <code>${e(w.distilled_status)}</code></div><div class="row"><b>Formalization.</b> ${e(w.formalization_status)}</div><div class="row"><b>Scope.</b> ${e(w.scope)}</div><div class="row"><b>Missing work.</b> ${e(w.missing_work)}</div><div class="row"><b>Evidence.</b><br>${(w.repo_evidence||[]).map(x=>`<code>${e(x)}</code>`).join('<br>')}</div></details>`).join('')||'<div class="muted">No matching works.</div>'}search.addEventListener('input',render);group.addEventListener('change',render);status.addEventListener('change',render);render();
</script></body></html>
