<title>__TITLE__</title>
<style>
:root{
  --bg:#fbfbf9; --panel:#fff; --ink:#1a1c1a; --muted:#6b6f6b; --line:#e2e4df; --line-soft:#eeefea;
  --accent:#2f6f4f; --accent-soft:#eaf2ec; --warn:#8a5a00; --warn-soft:#fdf3e0; --sel:#dce9e0;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  --shadow:0 1px 2px rgba(20,25,20,.05),0 6px 18px rgba(20,25,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131519; --panel:#1a1d22; --ink:#e7e9e6; --muted:#969c9b; --line:#2a2e35; --line-soft:#22262c;
  --accent:#74c495; --accent-soft:#1d2a23; --warn:#e2b467; --warn-soft:#2a2418; --sel:#22392c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#131519; --panel:#1a1d22; --ink:#e7e9e6; --muted:#969c9b; --line:#2a2e35; --line-soft:#22262c;
  --accent:#74c495; --accent-soft:#1d2a23; --warn:#e2b467; --warn-soft:#2a2418; --sel:#22392c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--sans);display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:#b9bcb9;flex:none;transition:background .25s}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
h1{font-size:13.5px;font-weight:640;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.spacer{flex:1}
.searchwrap{position:relative;flex:1;max-width:620px}
input[type=search]{width:100%;padding:6px 30px 6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px var(--sans)}
input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:10.5px var(--mono);color:var(--muted);pointer-events:none}
button{font:12.5px var(--sans);padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

main{flex:1;display:flex;min-height:0}
nav{width:274px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:6px 8px 24px}
nav h2{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 6px 4px;font-weight:650}
nav a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:12.5px;line-height:1.35;border:1px solid transparent}
nav a:hover{background:var(--line-soft)}
nav a.sel{background:var(--sel);border-color:var(--accent);font-weight:600}
nav a small{display:block;color:var(--muted);font-size:10.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .filter{width:100%;padding:5px 9px;margin:4px 0 2px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:12px var(--sans)}

section.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.crumb{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);flex:none;min-height:31px}
.crumb b{color:var(--ink);font-weight:600}
.crumb .rowsel{margin-left:auto;display:flex;gap:6px;align-items:center}
select{font:12px var(--sans);padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:340px}
iframe{flex:1;border:0;width:100%;background:var(--bg)}
.pane{flex:1;overflow:auto;padding:18px 22px;display:none}
.pane.show{display:block}
iframe.hide{display:none}

aside{width:340px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 30px;display:none}
aside.show{display:block}
aside h3{margin:0 0 2px;font-size:13px;font-family:var(--mono);word-break:break-all;line-height:1.4}
aside .sub{color:var(--muted);font-size:11.5px;margin-bottom:12px}
aside .occ{display:block;width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg);cursor:pointer}
aside .occ:hover{border-color:var(--accent)}
aside .occ .d{font-weight:600;font-size:12px}
aside .occ .m{color:var(--muted);font-size:11px;font-family:var(--mono)}
.close{float:right;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}

.hit{padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--panel);cursor:pointer}
.hit:hover,.hit.cur{border-color:var(--accent);background:var(--accent-soft)}
.hit .d{font-weight:600;color:var(--accent);font-size:12.5px}
.hit .f{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.hit .x{margin-top:2px}
mark{background:var(--sel);color:inherit;border-radius:2px;padding:0 1px}
.group{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 0 5px;font-weight:650}
.empty{color:var(--muted);padding:26px 4px}
.bar{padding:5px 12px;background:var(--warn-soft);color:var(--warn);font-size:12px;border-bottom:1px solid var(--line);display:none;flex:none}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:650;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
code{font-family:var(--mono);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:20px;background:var(--line-soft);color:var(--muted);font-size:10.5px;margin-left:6px}
.chip.a{background:var(--accent-soft);color:var(--accent)}
a.name{color:var(--accent);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.audit{max-width:1180px}
.audit h2{font-size:15px;margin:0 0 2px;font-family:var(--mono);word-break:break-all;line-height:1.4}
.audit .where{color:var(--muted);font-size:12px;margin-bottom:14px}
.sec{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;background:var(--panel);overflow:hidden}
.sec>summary{padding:8px 12px;cursor:pointer;font-weight:600;font-size:12.5px;list-style:none;display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:before{content:'▸';color:var(--muted);font-size:11px;transition:transform .15s}
.sec[open]>summary:before{transform:rotate(90deg)}
.sec>summary:hover{background:var(--line-soft)}
.sec .body{padding:2px 12px 12px;border-top:1px solid var(--line-soft)}
pre.lean{background:var(--line-soft);border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow:auto;font:12px/1.65 var(--mono);max-height:60vh;white-space:pre;tab-size:2}
pre.lean .k{color:#8250b5;font-weight:600}
pre.lean .c{color:var(--muted);font-style:italic}
pre.lean .s{color:#a05a2c}
pre.lean .n{color:#2f6f4f}
pre.lean .t{color:#2b6cb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) pre.lean{
  --k:#c792ea; --s:#e2b467; --n:#74c495; --t:#79b8ff;}}
:root[data-theme="dark"] pre.lean{--k:#c792ea; --s:#e2b467; --n:#74c495; --t:#79b8ff;}
pre.lean{--k:#8250b5; --s:#a05a2c; --n:#2f6f4f; --t:#2b6cb0}
pre.lean .k{color:var(--k)} pre.lean .s{color:var(--s)} pre.lean .n{color:var(--n)} pre.lean .t{color:var(--t)}
pre.lean .id{border-radius:3px;padding:0 1px;margin:0 -1px}
pre.lean .id:hover{background:var(--sel);cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
pre.lean .id.known{cursor:pointer}

/* the headline landing page */
.home{max-width:1240px}
.home .lede{color:var(--muted);margin:0 0 4px}
.home .toolbar{display:flex;gap:8px;align-items:center;margin:12px 0 18px;flex-wrap:wrap}
.paper{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650;
  margin:22px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.paper:first-of-type{margin-top:4px}
.paper .cite{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
  padding:13px 15px 12px;margin:0 0 13px}
.card .top{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.card .rid{font:600 11px var(--mono);color:var(--muted);background:var(--line-soft);
  border-radius:5px;padding:1px 6px}
.card h4{margin:0;font-size:14.5px;font-weight:640;letter-spacing:-.01em}
.card .claim{margin:8px 0 0;line-height:1.6}
.card .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
.card .acts .sp{flex:1}
.card .decls{margin-top:10px}
.card .declname{font:600 11.5px var(--mono);color:var(--accent);cursor:pointer;
  display:inline-block;margin:0 0 4px;text-decoration:underline dotted;text-underline-offset:3px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:600;
  background:var(--line-soft);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* prose <-> Lean, on the audit page */
.clause{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:0 0 8px;background:var(--bg)}
.clause .src{margin:0}
.clause .arrow{color:var(--muted);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  margin:7px 0 4px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.clause .lean{margin:0;color:var(--ink)}
.clause .ex{margin:7px 0 0;color:var(--muted);font-size:12px;border-left:2px solid var(--line);padding-left:8px}
.clause .edit{margin-top:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.clause .edit select{max-width:220px}
.clause .saved{color:var(--accent);font-size:11px}

/* what the statement is stated in */
.vocab{display:grid;grid-template-columns:1fr;gap:5px}
.vrow{border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.vrow>summary{padding:6px 10px;cursor:pointer;display:flex;gap:9px;align-items:baseline;
  list-style:none;font-size:12.5px}
.vrow>summary::-webkit-details-marker{display:none}
.vrow>summary:hover{background:var(--line-soft)}
.vrow>summary code{font-weight:600;color:var(--accent)}
.vrow>summary .m{color:var(--muted);font-size:11px;margin-left:auto;font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.vrow .body{padding:2px 10px 10px;border-top:1px solid var(--line-soft)}

/* hover card: what an identifier in a statement actually is */
#hov{position:fixed;z-index:40;max-width:min(560px,46vw);background:var(--panel);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;display:none}
#hov.on{display:block}
#hov h4{margin:0 0 3px;font:600 12.5px var(--mono);word-break:break-all;line-height:1.35}
#hov .kindline{color:var(--muted);font-size:11px;margin-bottom:7px}
#hov .doc{margin:0 0 8px;max-height:9em;overflow:hidden;color:var(--ink)}
#hov pre{background:var(--line-soft);border:1px solid var(--line);border-radius:7px;margin:0 0 8px;
  padding:7px 9px;font:11.5px/1.6 var(--mono);max-height:15em;overflow:auto;white-space:pre-wrap}
#hov .foot{color:var(--muted);font-size:11px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#hov .foot b{color:var(--accent);font-weight:600}

.stale{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 11px;font-size:12px;margin:0 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px;margin:6px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chips code{background:var(--line-soft);border:1px solid var(--line);border-radius:14px;padding:1px 8px;font-size:11px;cursor:pointer}
.chips code:hover{border-color:var(--accent);color:var(--accent)}
/* readiness */
.ready{display:flex;align-items:center;gap:9px;padding:4px 12px;background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;border-bottom:1px solid var(--line);flex:none}
.ready .track{flex:1;max-width:220px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.ready .fill{height:100%;background:var(--accent);transition:width .3s ease}
.ready button{padding:1px 8px;font-size:11px;border-color:transparent;background:transparent;color:inherit}
.spinner{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:9px;color:var(--muted);padding:24px 4px;font-size:13px}
.skel{height:11px;border-radius:5px;background:linear-gradient(90deg,var(--line-soft),var(--line),var(--line-soft));
  background-size:200% 100%;animation:sh 1.2s linear infinite;margin:7px 0}
@keyframes sh{to{background-position:-200% 0}}
.notready{border:1px dashed var(--line);border-radius:9px;padding:12px 14px;color:var(--muted);font-size:12.5px}
.notready b{color:var(--ink)}
#frameWrap{flex:1;position:relative;min-height:0;display:flex}
#frameLoad{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  gap:10px;background:var(--bg);color:var(--muted);font-size:13px;z-index:2}
#frameLoad.on{display:flex}
</style>

<header>
  <div class="brand"><span class="dot" id="live" title="live connection"></span><h1>__TITLE__</h1></div>
  <div class="searchwrap">
    <input type="search" id="q" placeholder="Search ledgers and declarations…" autocomplete="off">
    <span class="kbd">/</span>
  </div>
  <button id="sharedBtn" title="Declarations named by more than one ledger">Shared</button>
  <button id="journalBtn">Journal</button>
  <button id="themeBtn" title="Toggle theme">Theme</button>
  <button id="reloadBtn" title="Rescan the repository for ledgers">Rescan</button>
</header>
<div class="bar" id="bar"></div>
<div class="ready" id="ready" hidden>
  <span class="spinner"></span><span id="readyText">Preparing…</span>
  <span class="track"><span class="fill" id="readyFill" style="width:0%"></span></span>
  <span id="readyCount" style="font-variant-numeric:tabular-nums"></span>
  <button id="readyDetail">details</button>
</div>
<main>
  <nav id="nav"></nav>
  <section class="main">
    <div class="crumb" id="crumb"><span class="empty" style="padding:0">Loading…</span></div>
    <div id="frameWrap">
      <iframe id="frame" title="view"></iframe>
      <div id="frameLoad"><span class="spinner"></span><span id="frameLoadText">Loading…</span></div>
    </div>
    <div class="pane" id="pane"></div>
  </section>
  <aside id="side"></aside>
</main>
<div id="hov"></div>

<script>
const $ = s => document.querySelector(s);
const nav=$('#nav'), frame=$('#frame'), pane=$('#pane'), side=$('#side'), bar=$('#bar'),
      crumb=$('#crumb'), qIn=$('#q');
const e = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async u => (await fetch(u)).json();

let catalog=null, current=null, hits=[], cursor=-1;

/* ---- theme ---------------------------------------------------------- */
const THEMES=['system','light','dark'];
let theme = localStorage.getItem('aiq.theme') || 'system';
function applyTheme(){
  if(theme==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  $('#themeBtn').textContent = 'Theme: ' + theme;
}
$('#themeBtn').onclick=()=>{ theme=THEMES[(THEMES.indexOf(theme)+1)%3]; localStorage.setItem('aiq.theme',theme); applyTheme(); pushTheme(); };
applyTheme();

/* ---- routing --------------------------------------------------------- */
/* #view/census/slug  ·  #decl/Some.Name  ·  #journal  ·  #shared          */
function go(hash, push=true){ if(push && location.hash!==('#'+hash)) location.hash=hash; else route(); }

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  if(!h){ go('home'); return; }
  const [kind,...rest]=h.split('/');
  if(kind==='home'){ showHome(); }
  else if(kind==='view'){ showView(rest[0], rest.slice(1).join('/')); }
  else if(kind==='decl'){ showDeclaration(rest.join('/')); }
  else if(kind==='audit'){ showAudit(rest.join('/')); }
  else if(kind==='deps'){ showDeps(rest.join('/')); }
  else if(kind==='journal'){ showJournal(); }
  else if(kind==='shared'){ showShared(); }
}
addEventListener('hashchange', route);

function markNav(route_){
  nav.querySelectorAll('a').forEach(a=>a.classList.toggle('sel', a.dataset.route===route_));
}
function showPane(html){ frame.classList.add('hide'); pane.classList.add('show'); pane.innerHTML=html; pane.scrollTop=0; }
function themedUrl(url){ return url + (url.includes('?')?'&':'?') + 'theme=' + (theme==='system'?systemTheme():theme); }
function systemTheme(){ return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function showFrame(url, label){
  pane.classList.remove('show'); frame.classList.remove('hide');
  const want = themedUrl(url);
  // Re-selecting the view already on screen should cost nothing: reassigning
  // src reloads and re-parses up to a megabyte of embedded JSON.
  if (frame.dataset.url === want) { frameLoading(false); return; }
  frame.dataset.url = want;
  frameLoading(true, label);
  frame.src = want;
}
function pushTheme(){ try{ frame.contentWindow.postMessage({aiq:'theme', value: theme==='system'?systemTheme():theme}, '*'); }catch(_){} }

/* ---- the headline landing page --------------------------------------- */
/* A reviewer arriving at this server wants the results the papers are judged
   on, with the Lean beside the prose, not a ledger index to navigate first.
   Everything deeper -- the clause map, the elaboration, the vocabulary -- is
   one click from a card rather than several from a sidebar. */
let homeShowMajor=false;
const prefetched=new Set();

const TERMINAL=new Set(['compiled_exact','proved_in_build','accepted','established','exact']);
function tag(value, label){
  if(!value) return '';
  const cls = TERMINAL.has(value) ? 'ok' : 'warn';
  return `<span class="tag ${cls}" title="${e(label||'')}">${e(String(value).replace(/_/g,' '))}</span>`;
}

function headlineCard(x){
  const decls=x.canonical||[];
  const stmt = d => `<div><span class="declname" data-n="${e(d.name)}">${e(d.name)}</span>`
    + (d.statement
        ? `<pre class="lean" data-module="${e(d.module||'')}">${leanHl(d.statement)}</pre>`
        : `<div class="empty" style="padding:2px 0">not located in the Lean sources</div>`)
    + '</div>';
  const rest = decls.slice(1);
  return `<div class="card" data-slug="${e(x.slug)}" data-row="${e(x.id)}">
    <div class="top"><span class="rid">${e(x.id)}</span><h4>${e(x.title||x.id)}</h4>
      <span class="sp"></span>${tag(x.status,'implementation status')}${tag(x.verification,'what the build certifies')}${tag(x.certification,'hostile semantic review')}</div>
    <div class="sub" style="color:var(--muted);font-size:11.5px">
      ${e(x.sourceAnchor||('Section '+(x.section||'?')))}
      ${x.clauseCount?` · ${x.clauseCount} clause${x.clauseCount===1?'':'s'}`:''}
      ${x.clauseOpen?` · <b style="color:var(--warn)">${x.clauseOpen} not established</b>`:''}
      ${x.hasReview?'':' · <span class="tag warn" title="no curated prose-to-Lean correspondence exists for this row">no semantic review</span>'}
      ${x.canonicalTotal?` · ${x.canonicalTotal} canonical declaration${x.canonicalTotal===1?'':'s'}`:''}
      ${x.canonicalTotal>decls.length?` <span class="chip">showing ${decls.length}</span>`:''}</div>
    ${(x.claim||x.summary)?`<p class="claim">${e(x.claim||x.summary)}</p>`:''}
    <div class="decls">${decls.length?stmt(decls[0]):'<div class="empty" style="padding:2px 0">No canonical declaration is recorded for this row.</div>'}
      ${rest.length?`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted);font-size:12px">${rest.length} further canonical statement${rest.length===1?'':'s'}</summary>${rest.map(stmt).join('')}</details>`:''}</div>
    <div class="acts">

/* ---- readiness ------------------------------------------------------- */
/* The expensive preparation is visible rather than hidden behind a spinner
   that cannot say what it is waiting for: each stage names what it provides,
   so a panel that is not available yet can explain itself in those terms. */
let readiness = null, readyTimer = null;

function stage(name){ return (readiness?.stages||[]).find(s=>s.name===name); }
function stageReady(name){ const s=stage(name); return !s || s.state==='ready'; }

function renderReadiness(){
  const strip=$('#ready');
  if(!readiness){ strip.hidden=true; return; }
  if(readiness.ready){
    // Leave the last frame up briefly so a fast start is still legible.
    $('#readyText').textContent='Ready';
    $('#readyFill').style.width='100%';
    setTimeout(()=>{ if(readiness?.ready) strip.hidden=true; }, 900);
    return;
  }
  strip.hidden=false;
  $('#readyText').textContent = readiness.working || 'Preparing…';
  $('#readyFill').style.width = Math.round(100*readiness.done/readiness.total)+'%';
  $('#readyCount').textContent = `${readiness.done}/${readiness.total}`;
}

async function pollReadiness(){
  try{
    readiness = await api('/api/ready');
    renderReadiness();
    if(!readiness.ready){ clearTimeout(readyTimer); readyTimer=setTimeout(pollReadiness, 700); }
    else if(pendingRefresh){ pendingRefresh=false; route(); }
  }catch(_){ clearTimeout(readyTimer); readyTimer=setTimeout(pollReadiness, 2000); }
}
let pendingRefresh=false;

$('#readyDetail').onclick=()=>{
  if(!readiness) return;
  showPane('<div class="audit"><h2 style="font-family:var(--sans)">Preparation</h2>'
    + '<p style="color:var(--muted)">A server pays these costs once. Everything already finished is usable now.</p>'
    + '<table><tr><th>stage</th><th>state</th><th>provides</th><th>time</th><th>detail</th></tr>'
    + readiness.stages.map(s=>`<tr>
        <td>${e(s.label)}</td>
        <td>${s.state==='working'?'<span class="spinner"></span> ':''}${e(s.state)}</td>
        <td>${e(s.provides)}</td>
        <td>${s.seconds?s.seconds+'s':''}</td>
        <td>${e(s.detail||'')}</td></tr>`).join('')
    + '</table></div>');
};

/* A panel whose data is not prepared yet says which stage it is waiting on. */
function notReady(name, what){
  const s=stage(name);
  if(!s || s.state==='ready') return '';
  if(s.state==='failed')
    return `<div class="notready"><b>${e(what)} is unavailable.</b><br>${e(s.label)} failed: <code>${e(s.detail||'')}</code></div>`;
  return `<div class="notready"><span class="spinner"></span> <b>${e(what)} is still loading.</b><br>
          ${e(s.label)} — this is prepared once per server start.</div>`;
}

/* ---- Lean highlighting ------------------------------------------------ */
/* Small on purpose: keywords, comments, strings, sorts, and identifiers.
   No CDN or grammar file to keep in step with Lean.

   Identifiers are marked up because they are the point: every name in a
   statement is something a reviewer may not know, and marking them is what
   lets the hover card and the vocabulary panel work off the same text. */
const LEAN_KEYWORDS = new Set([
 'theorem','lemma','def','abbrev','instance','structure','class','inductive','where','example',
 'by','fun','let','have','show','from','calc','match','with','do','if','then','else','at','in',
 'variable','universe','namespace','end','section','open','import','export','attribute','deriving',
 'noncomputable','private','protected','partial','unsafe','mutual','omit','include','set_option',
 'exact','apply','intro','intros','refine','simp','simpa','rw','rwa','constructor','cases','rcases',
 'obtain','use','induction','ring','linarith','nlinarith','positivity','norm_num','field_simp',
 'unfold','change','convert','congr','ext','funext','subst','specialize','gcongr','bound','trans',
 'this','admit','all_goals','any_goals','first','try','repeat','focus','conv','push_cast'
]);
const LEAN_SORTS = new Set(['Prop','Type','Sort']);
/* Letters, digits, primes, bangs, questions and the subscripts Lean names use
   (category No, so \p{N} does not cover them). Dotted names are one token: the
   reviewer means `Submodule.HasOrthogonalProjection`, not two words. */
const LEAN_ID = /[\p{L}_][\p{L}\p{N}_'!?\u2080-\u2089]*(?:\.[\p{L}_][\p{L}\p{N}_'!?\u2080-\u2089]*)*/gu;

/* Tokenized before escaping, never after: `&amp;` contains four letters, and a
   pass over escaped text marked them up as an identifier named `amp`. */
function leanCode(text){
  let out='', last=0;
  for(const m of text.matchAll(LEAN_ID)){
    out += e(text.slice(last, m.index));
    const w = m[0];
    if(LEAN_SORTS.has(w)) out += `<span class="t">${e(w)}</span>`;
    else if(LEAN_KEYWORDS.has(w)) out += `<span class="k">${e(w)}</span>`;
    else if(w.length > 1) out += `<span class="id" data-n="${e(w)}">${e(w)}</span>`;
    else out += e(w);
    last = m.index + w.length;
  }
  return out + e(text.slice(last));
}

function leanHl(src){
  const out=[]; let i=0;
  src = String(src ?? '');
  while(i<src.length){
    if(src.startsWith('/-',i)){ const j=src.indexOf('-/',i+2); const end=j<0?src.length:j+2;
      out.push(`<span class="c">${e(src.slice(i,end))}</span>`); i=end; continue; }
    if(src.startsWith('--',i)){ const j=src.indexOf('\n',i); const end=j<0?src.length:j;
      out.push(`<span class="c">${e(src.slice(i,end))}</span>`); i=end; continue; }
    if(src[i]==='"'){ let j=i+1; while(j<src.length&&!(src[j]==='"'&&src[j-1]!=='\\')) j++;
      out.push(`<span class="s">${e(src.slice(i,j+1))}</span>`); i=j+1; continue; }
    let j=i; while(j<src.length && !src.startsWith('/-',j) && !src.startsWith('--',j) && src[j]!=='"') j++;
    out.push(leanCode(src.slice(i,j)));
    i=j;
  }
  return out.join('');
}

/* ---- what is this identifier? ---------------------------------------- */
/* Every name in a rendered statement is a question a reviewer may have, and
   leaving the page to answer it loses the statement. The card answers in
   place; a click commits to the full audit. Resolution is the server's job --
   source text writes names the way Lean resolves them, relative to open
   namespaces, and only the index knows the qualified spelling. */
const hov=$('#hov');
const symbolCache=new Map();
let hovTimer=null, hovFor=null;

function symbolKey(name, module){ return name + '\u0000' + (module||''); }

async function symbolOf(name, module){
  const key=symbolKey(name, module);
  if(symbolCache.has(key)) return symbolCache.get(key);
  const p = fetch('/api/symbol?name='+encodeURIComponent(name)
                  + (module?'&module='+encodeURIComponent(module):''))
    .then(r=>r.ok?r.json():null).then(d=>(d && d.name)?d:null).catch(()=>null);
  symbolCache.set(key, p);
  return p;
}

function placeHover(el){
  const r=el.getBoundingClientRect(), box=hov.getBoundingClientRect();
  let left=Math.min(r.left, innerWidth-box.width-14);
  let top=r.bottom+8;
  if(top+box.height>innerHeight-8) top=Math.max(8, r.top-box.height-8);
  hov.style.left=Math.max(8,left)+'px'; hov.style.top=top+'px';
}

function hideHover(){ clearTimeout(hovTimer); hovFor=null; hov.classList.remove('on'); }

function showHover(el, sym){
  hov.innerHTML=`<h4>${e(sym.name)}</h4>`
    + `<div class="kindline">${e(sym.kind||'declaration')}${sym.module?' · '+e(sym.module):''}`
    + `${sym.path?` · <code>${e(sym.path)}:${sym.line}</code>`:''}</div>`
    + (sym.docstring?`<div class="doc">${e(sym.docstring)}</div>`:'')
    + (sym.signature?`<pre>${leanHl(sym.signature)}</pre>`:'')
    + `<div class="foot"><b>click to audit →</b>`
    + (sym.candidates&&sym.candidates.length
        ? `<span>also matches ${sym.candidates.map(e).join(', ')}</span>`:'')
    + '</div>';
  hov.classList.add('on');
  placeHover(el);
}

function moduleOf(el){ const p=el.closest('[data-module]'); return p?p.dataset.module:''; }

addEventListener('mouseover', ev=>{
  const el=ev.target.closest && ev.target.closest('.id[data-n]');
  if(!el){ if(!hov.contains(ev.target)) hideHover(); return; }
  if(hovFor===el) return;
  clearTimeout(hovTimer);
  hovFor=el;
  hovTimer=setTimeout(async ()=>{
    const sym=await symbolOf(el.dataset.n, moduleOf(el));
    if(hovFor!==el) return;
    if(!sym){ hov.classList.remove('on'); return; }
    el.classList.add('known'); el.dataset.q=sym.name;
    showHover(el, sym);
  }, 180);
}, {passive:true});

addEventListener('click', async ev=>{
  const el=ev.target.closest && ev.target.closest('.id[data-n]');
  if(!el) return;
  const sym = el.dataset.q ? {name:el.dataset.q} : await symbolOf(el.dataset.n, moduleOf(el));
  if(!sym) return;
  hideHover();
  go('audit/'+encodeURIComponent(sym.name));
});
addEventListener('scroll', hideHover, true);

function sec(title, bodyHtml, open){

  return '<div class="chips">'+names.map(n=>`<code class="${cls||'jump'}" data-n="${e(n)}">${e(n)}</code>`).join('')+'</div>';

/* ---- the theorem audit page ------------------------------------------ */
/* Ordered the way a reviewer reads: what the paper claims, what the author
   wrote, what the compiler made of it, what vocabulary that rests on, and only
   then how it is proved. Each section is a question; none of them require
   leaving the page to answer. */

const CLAUSE_STATUS = ['claimed_exact','claimed_generalized','claimed_weaker','open','unreviewed'];

/* A clause is three claims -- the sentence, the Lean it becomes, and the
   verdict on that correspondence -- and each is written and journaled on its
   own, so a reviewer who only changes the verdict leaves no trace on the
   prose. */
function clauseCard(c, slug){
  const P = c.pointers || {};
  const opts = CLAUSE_STATUS.concat(c.status && !CLAUSE_STATUS.includes(c.status) ? [c.status] : []);
  return `<div class="clause" data-slug="${e(slug)}" data-p='${e(JSON.stringify(P))}'>
    <p class="src" data-f="sourceClause">${e(c.sourceClause||'')}</p>
    <div class="arrow">↓ realized in Lean
      ${c.relation?`<span class="chip">${e(c.relation)}</span>`:''}
      ${c.kind?`<span class="chip">${e(c.kind)}</span>`:''}
      <span class="statushere">${tag(c.status)}</span>
      ${P.status?'<button class="cedit" style="margin-left:auto;padding:1px 8px;font-size:11px">Annotate</button>':''}</div>
    <p class="lean" data-f="leanRealization">${e(c.leanRealization||'')}</p>
    ${c.sourceExcerpt?`<p class="ex">${e(c.sourceExcerpt)}</p>`:''}
    <div class="edit" hidden>
      <select class="cs" data-f="status" data-was="${e(c.status||'')}">${opts.map(v=>`<option${v===c.status?' selected':''}>${e(v)}</option>`).join('')}</select>
      <button class="csave">Save</button><button class="ccancel">Cancel</button>
      <span class="saved" hidden></span></div>
  </div>`;
}

function wireClauseEditing(scope){
  const say=(box,text,ok)=>{ const n=box.querySelector('.saved');
    n.textContent=text; n.style.color=ok?'var(--accent)':'var(--warn)'; n.hidden=false; };
  scope.querySelectorAll('.clause .cedit').forEach(btn=>btn.onclick=()=>{
    const box=btn.closest('.clause');
    box.querySelectorAll('[data-f="sourceClause"],[data-f="leanRealization"]').forEach(el=>{
      el.contentEditable='true'; el.dataset.was=el.textContent;
      el.style.outline='1px dashed var(--line)'; el.style.padding='3px 5px'; el.style.borderRadius='5px';
    });
    box.querySelector('.edit').hidden=false;
    btn.hidden=true;
  });
  scope.querySelectorAll('.clause .ccancel').forEach(btn=>btn.onclick=()=>{
    const box=btn.closest('.clause');
    box.querySelectorAll('[data-f][data-was]').forEach(el=>{
      if(el.tagName==='SELECT'){ el.value=el.dataset.was; return; }
      el.textContent=el.dataset.was; el.contentEditable='false'; el.style.outline=''; });
    box.querySelector('.edit').hidden=true;
    box.querySelector('.cedit').hidden=false;
  });
  scope.querySelectorAll('.clause .csave').forEach(btn=>btn.onclick=async ()=>{
    const box=btn.closest('.clause'), pointers=JSON.parse(box.dataset.p||'{}');
    const sel=box.querySelector('.cs');
    const edits=[...box.querySelectorAll('[data-f][data-was]')].map(el=>
      [el.dataset.f, el.tagName==='SELECT'?el.value:el.textContent, el.dataset.was]);
    btn.disabled=true;
    const done=[], failed=[];
    for(const [field, value, before] of edits){
      if(value===before) continue;
      const ok=await annotate(box.dataset.slug, pointers[field], value, 'clause '+field);
      (ok===true?done:failed).push(ok===true?field:`${field}: ${ok}`);
    }
    btn.disabled=false;
    if(failed.length) return say(box, failed.join('; '), false);
    say(box, done.length?`written and journaled (${done.join(', ')})`:'nothing changed', true);
    box.querySelectorAll('[data-f][data-was]').forEach(el=>{
      el.dataset.was = el.tagName==='SELECT' ? el.value : el.textContent;
      if(el.tagName!=='SELECT'){ el.contentEditable='false'; el.style.outline=''; } });
    box.querySelector('.statushere').innerHTML=tag(sel.value);
    box.querySelector('.edit').hidden=true;
    box.querySelector('.cedit').hidden=false;
  });
}

function wireRowNote(scope){
  scope.querySelectorAll('.noteedit').forEach(btn=>btn.onclick=()=>{
    btn.closest('.sec').querySelector('.rownote').hidden=false; btn.hidden=true; });
  scope.querySelectorAll('.notecancel').forEach(btn=>btn.onclick=()=>{
    const sec=btn.closest('.sec');
    sec.querySelector('.rownote').hidden=true; sec.querySelector('.noteedit').hidden=false; });
  scope.querySelectorAll('.notesave').forEach(btn=>btn.onclick=async ()=>{
    const sec=btn.closest('.sec'), bar=sec.querySelector('.edit'), note=sec.querySelector('.saved');
    btn.disabled=true;
    const ok=await annotate(bar.dataset.slug, bar.dataset.ptr,
                            sec.querySelector('.rownote textarea').value, 'row note');
    btn.disabled=false;
    note.textContent = ok===true ? 'written and journaled' : ok;
    note.style.color = ok===true ? 'var(--accent)' : 'var(--warn)';
    note.hidden=false;
    if(ok===true){ sec.querySelector('.rownote').hidden=true; sec.querySelector('.noteedit').hidden=false; }
  });
}

/* One write, through the gated writer. Returns true, or the refusal to show. */
async function annotate(slug, pointer, value, why){
  if(!pointer) return 'this field is not addressable';
  try{
    const r=await fetch('/api/annotate',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({view:'census', slug, pointer, value, author:'browser',
                           note:why+', audit page'})});
    const d=await r.json();
    if(!r.ok||d.ok===false) return d.error||('refused ('+r.status+')');
    if(d.warnings&&d.warnings.length) return true;
    return true;
  }catch(err){ return String(err); }
}

function sourceStatementHtml(st){
  if(!st) return '';
  const part=(key,label)=>{
    const v=st[key]; if(!v||!v.length) return '';
    return `<b style="font-size:11.5px">${label}</b><ul style="margin:3px 0 9px;padding-left:20px">`
      + (Array.isArray(v)?v:[v]).map(x=>`<li>${e(x)}</li>`).join('') + '</ul>';
  };
  return part('setup','Setup') + part('hypotheses','Hypotheses')
       + part('conclusions','Conclusions') + part('conclusion','Conclusion');
}

function contextSection(ctx){
  if(!ctx || !ctx.rows || !ctx.rows.length)
    return sec('Source context', '<div class="empty" style="padding:6px 0">No census row registers this declaration, so there is no printed result it answers for.</div>');
  return ctx.rows.map(row=>sec(
    `Source context — ${row.paper}, ${row.title || row.id}`,
    `<div class="sub" style="color:var(--muted);font-size:11.5px;margin-bottom:8px">`
    + `<code>${e(row.id)}</code> · ${e(row.sourceAnchor||'')} · this declaration is `
    + `<b>${e(row.role)}</b> for the row ${tag(row.status)}${tag(row.verification)}</div>`
    + (row.claim?`<p style="margin:0 0 10px">${e(row.claim)}</p>`:'')
    + sourceStatementHtml(row.sourceStatement)
    + (row.clauses&&row.clauses.length
        ? `<b style="font-size:11.5px">Clause by clause — printed prose against the Lean that answers it</b>`
          + `<p style="color:var(--muted);font-size:11.5px;margin:2px 0 7px">Annotate writes the sentence, its Lean realization and the verdict back to the census, each journaled separately.</p>`
          + `<div>${row.clauses.map(c=>clauseCard(c,row.slug)).join('')}</div>`
        : `<p class="empty" style="padding:0">${row.hasReview
             ? 'This row carries a semantic review but no clause-level correspondence.'
             : 'No semantic review is recorded for this row, so there is no clause-level correspondence to read or annotate — only the row\u2019s own verdicts above.'}</p>`)
    + `<div class="edit" style="margin-top:10px" data-slug="${e(row.slug)}" data-ptr="${e(row.notePointer||'')}">`
    + `<button class="noteedit">Annotate the row note</button>`
    + `<span class="saved" hidden></span></div>`
    + `<div class="rownote" hidden><textarea rows="6" style="width:100%;font:12px var(--mono);`
    + `background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">`
    + `${e(row.note||'')}</textarea>`
    + `<div style="margin-top:6px;display:flex;gap:7px"><button class="notesave">Save note</button>`
    + `<button class="notecancel">Cancel</button></div></div>`
    + `<button data-align="${e(row.slug)}" data-row="${e(row.id)}" style="margin-top:10px">Open the full source ↔ Lean view →</button>`,
    true)).join('');
}

function vocabularySection(v){
  if(!v || !v.symbols || !v.symbols.length)
    return sec('Statement vocabulary',
      '<div class="empty" style="padding:6px 0">No resolvable names were found in this statement.</div>');
  const groups=[['project','Defined in this project'],['boundary','From Mathlib or Tau Ceti']];
  let h=`<p style="color:var(--muted);font-size:12px;margin:4px 0 10px">Every name this statement is written in, resolved against the source index. Expand one to read its docstring and definition without leaving the page.</p>`;
  for(const [key,label] of groups){
    const list=v.symbols.filter(x=>x.group===key);
    if(!list.length) continue;
    h+=`<b style="font-size:11.5px">${label} (${list.length})</b><div class="vocab" style="margin:5px 0 12px">`
     + list.map(x=>`<details class="vrow" data-n="${e(x.name)}">
          <summary><code>${e(x.short||x.name)}</code>
            <span style="color:var(--muted);font-size:11px">${e(x.kind||'')}</span>
            <span class="m">${e(x.module||'')}</span></summary>
          <div class="body"><div class="loading"><span class="spinner"></span> reading…</div></div>
        </details>`).join('') + '</div>';
  }
  return sec(`Statement vocabulary — ${v.symbols.length} name(s)`, h, true);
}

function wireVocabulary(scope){
  scope.querySelectorAll('.vrow').forEach(row=>row.addEventListener('toggle', async ()=>{
    if(!row.open || row.dataset.done) return;
    row.dataset.done='1';
    const body=row.querySelector('.body');
    const sym=await symbolOf(row.dataset.n, '');
    if(!sym){ body.innerHTML='<div class="empty" style="padding:4px 0">Not resolvable.</div>'; return; }
    body.innerHTML = (sym.docstring?`<div style="white-space:pre-wrap;margin:6px 0 8px">${e(sym.docstring)}</div>`:'')
      + (sym.source||sym.signature
          ? `<pre class="lean" data-module="${e(sym.module||'')}">${leanHl(sym.source||sym.signature)}</pre>`:'')
      + `<div class="foot" style="color:var(--muted);font-size:11px;margin-top:6px">`
      + (sym.path?`<code>${e(sym.path)}:${sym.line}</code> · `:'')
      + `<a class="name" data-n="${e(sym.name)}">full audit of ${e(sym.name)} →</a></div>`;
    body.querySelectorAll('a.name').forEach(a=>a.onclick=()=>go('audit/'+encodeURIComponent(a.dataset.n)));
  }));
}

async function showAudit(name){
  markNav('');
  crumb.innerHTML=`<b>Audit</b><code style="color:var(--muted)">${e(name)}</code>`;
  showPane('<div class="audit"><div class="loading"><span class="spinner"></span> Gathering source, elaboration, vocabulary and dependencies…</div>'
    + '<div class="skel" style="width:60%"></div><div class="skel" style="width:90%"></div>'
    + '<div class="skel" style="width:75%"></div><div class="skel" style="width:40%"></div></div>');
  // Four independent answers, asked at once: the slowest must not serialize
  // behind the others.
  let d, ctx=null, vocab=null;
  try{
    [d, ctx, vocab] = await Promise.all([
      api('/api/declaration/'+encodeURIComponent(name)),
      api('/api/context/'+encodeURIComponent(name)).catch(()=>null),
      api('/api/vocabulary/'+encodeURIComponent(name)).catch(()=>null),
    ]);
  }
  catch(_){ return showPane(`<div class="empty">Nothing known about <code>${e(name)}</code>.</div>`); }
  if(d.detail) return showPane(`<div class="empty">${e(d.detail)}</div>`);

  const src=d.source, el=d.elaborated, gs=d.graphStatus||{};
  const mod = (el&&el.module) || (src&&src.module) || '';
  let h='<div class="audit">';
  h+=`<h2>${e(d.name)}</h2><div class="where">`
   + (src?`<code>${e(src.path)}:${src.line}</code>`:'<em>no source location found</em>')
   + (el&&el.kind?` · ${e(el.kind)}`:'') + (mod?` · <code>${e(mod)}</code>`:'')
   + `</div>`;

  if(gs.stale) h+=`<div class="stale"><b>The dependency graph is out of date.</b> ${e(gs.newerSource||'A source file')} is newer than the saved index, so proof dependencies below may name declarations that have since changed. Rebuild with <code>${e(gs.rebuild||'')}</code>.</div>`;

  h+=contextSection(ctx);

  if(src) h+=sec('Source as written — docstring and statement',
      `<pre class="lean" data-module="${e(mod)}">${leanHl(src.statement || src.header || '')}</pre>`, true);
  else h+=sec('Source as written', notReady('sources','The source snippet')
      || '<div class="empty" style="padding:6px 0">No source location found for this name.</div>', true);

  if(el) h+=sec('Elaborated signature — what the compiler sees',
      `<pre class="lean" data-module="${e(mod)}">${leanHl(el.signature||el.type||'')}</pre>`
    + (el.docstring?`<div style="white-space:pre-wrap;font-size:12.5px;margin:8px 0">${e(el.docstring)}</div>`:'')
    + `<dl class="kv"><dt>kind</dt><dd>${e(el.kind||'—')}</dd>`
    + `<dt>module</dt><dd>${e(el.module||'—')}</dd>`
    + `<dt>library</dt><dd>${e(el.library||'—')}</dd>`
    + `<dt>is a Prop</dt><dd>${el.isProp===null?'—':el.isProp}</dd>`
    + `<dt>structural hash</dt><dd>${e(el.hashes.expr||'—')}</dd>`
    + `<dt>printed-type hash</dt><dd>${e((el.hashes.text||'').slice(0,32)||'—')}</dd></dl>`, true);
  else h+=sec('Elaborated signature',
      notReady('statements','The elaborated signature')
      || `<div class="empty" style="padding:6px 0">${e(d.elaboratedHint||'Not elaborated.')}</div>`);

  h+=vocabularySection(vocab);

  if(d.closure){
    const c=d.closure;
    h+=sec(`Statement closure — unfolded through the project (${(c.unfolded||[]).length} unfolded, ${(c.leaves||[]).length} leaf)`,
      `<p style="color:var(--muted);font-size:12px">What the <em>statement</em> depends on once project definitions are unfolded. This is what decides whether a theorem is phrased in the paper's vocabulary or in a private one.</p>`
      + `<b style="font-size:12px">Boundary vocabulary</b>${chips(c.boundary)}`
      + `<b style="font-size:12px;display:block;margin-top:10px">Unfolded project constants</b>${chips(c.unfolded)}`
      + `<b style="font-size:12px;display:block;margin-top:10px">Leaves</b>${chips(c.leaves)}`);
  }

  const pr=d.proof;
  if(pr){
    h+=sec(`Proof dependencies — ${pr.nodeCount} declaration(s), ${pr.edgeCount} edge(s)`,
      (pr.axioms?`<b style="font-size:12px">Axioms</b>${chips(pr.axioms)}<div style="height:10px"></div>`:'')
      + `<b style="font-size:12px">By library</b><table><tr><th>library</th><th>declarations</th></tr>`
      + Object.entries(pr.byLibrary||{}).map(([k,v])=>`<tr><td>${e(k)}</td><td>${v}</td></tr>`).join('')+'</table>'
      + `<b style="font-size:12px;display:block;margin-top:10px">Direct dependencies</b>`
      + ((pr.direct||[]).length?`<table><tr><th>role</th><th>declaration</th><th>kind</th></tr>`
          + pr.direct.map(x=>`<tr><td>${e(x.role)}</td><td><a class="name" data-n="${e(x.name)}">${e(x.name)}</a></td><td>${e(x.kind||'')}</td></tr>`).join('')+'</table>'
        : '<span class="empty" style="padding:0">none in project</span>'));
  } else {
    h+=sec('Proof dependencies',
      notReady('graph','Proof dependencies')
      || `<div class="empty" style="padding:6px 0">${e(d.proofHint||'No dependency information.')}</div>`);
  }

  const occ=d.occurrences||[];
  h+=sec(`Registered in ${new Set(occ.map(o=>o.view+'/'+o.slug)).size} ledger(s) — ${occ.length} mention(s)`,
    occ.length?`<table><tr><th>ledger</th><th>view</th><th>row</th><th>field</th></tr>`
      + occ.map(o=>`<tr><td><a class="name" data-v="${e(o.view)}" data-s="${e(o.slug)}" data-r="${e(o.row)}">${e(o.document)}</a></td>
          <td>${e(o.view)}</td><td>${e(o.row)}</td><td><code>${e(o.field)}</code></td></tr>`).join('')+'</table>'
    : '<span class="empty" style="padding:0">No ledger registers this declaration.</span>');

  h+='</div>';
  showPane(h);
  wireChips();
  wireClauseEditing(pane);
  wireRowNote(pane);
  wireVocabulary(pane);
  pane.querySelectorAll('a.name[data-n]').forEach(a=>a.onclick=()=>go('audit/'+encodeURIComponent(a.dataset.n)));
  pane.querySelectorAll('a.name[data-v]').forEach(a=>a.onclick=()=>{
    go(`view/${a.dataset.v}/${a.dataset.s}`);
    if(a.dataset.r) setTimeout(()=>frame.contentWindow.postMessage({aiq:'scroll-to',id:a.dataset.r},'*'),700);
  });
  pane.querySelectorAll('button[data-align]').forEach(b=>b.onclick=()=>{
    go('view/alignment/'+b.dataset.align);
    setTimeout(()=>{ try{ frame.contentWindow.postMessage({aiq:'scroll-to', id:b.dataset.row},'*'); }catch(_){} }, 700);
  });
}

/* ---- dependency overview --------------------------------------------- */
async function showDeps(name){
  markNav('deps');
  const st = await api('/api/graph/status');
  crumb.innerHTML='<b>Dependencies</b><span class="chip">proof structure</span>';
  if(!st.present) return showPane(`<div class="empty">No saved dependency graph.<br><br>Build one with <code>${e(st.rebuild||'leanq graph-index --out build/leanq/project-semantic-graph.json')}</code>, or run <code>./viz-proof-structure.sh</code>.</div>`);
  let h='<div class="audit">';
  if(st.stale) h+=`<div class="stale"><b>Out of date.</b> ${e(st.newerSource||'A source file')} is newer than the index. Rebuild with <code>${e(st.rebuild)}</code>.</div>`;
  h+=`<dl class="kv"><dt>index</dt><dd>${e(st.path)}</dd><dt>declarations</dt><dd>${st.declarations}</dd>
      <dt>status</dt><dd>${st.stale?'stale':'current'}</dd></dl>
      <p style="color:var(--muted)">Pick any declaration to see its proof dependencies, axioms and statement closure. Search above, or open one from a census row.</p>`;
  const shared=await api('/api/xref?shared=true&limit=40');
  h+='<b style="font-size:12px">Declarations several ledgers depend on</b><table><tr><th>declaration</th><th>ledgers</th></tr>'
   + shared.shared.map(x=>`<tr><td><a class="name" data-n="${e(x.name)}">${e(x.name)}</a></td><td>${x.documents}</td></tr>`).join('')+'</table></div>';
  showPane(h);
  pane.querySelectorAll('a.name').forEach(a=>a.onclick=()=>go('audit/'+encodeURIComponent(a.dataset.n)));
}

/* ---- catalog + sidebar ---------------------------------------------- */
async function loadCatalog(refresh){
  catalog = await api('/api/catalog'+(refresh?'?refresh=true':''));
  const byView={};
  for(const d of catalog.documents) (byView[d.view] ||= []).push(d);
  let h = '<input class="filter" id="navfilter" placeholder="Filter ledgers…" autocomplete="off">';
  h += '<h2>Overview</h2>'
     + '<a data-route="home" data-t="headline theorems results">Headline theorems<small>what each paper is judged on</small></a>'
     + '<a data-route="view/workspace" data-t="workspace everything">Workspace<small>every ledger, one summary</small></a>'
     + '<a data-route="shared" data-t="shared declarations">Shared declarations<small>what the ledgers agree on</small></a>'
     + '<a data-route="deps" data-t="dependencies proof graph">Dependencies<small>proof structure and axioms</small></a>'
     + '<a data-route="journal" data-t="journal annotations">Journal<small>annotation history</small></a>';
  for(const v of catalog.views){
    const docs=byView[v.name]; if(!docs||!docs.length) continue;
    h += `<h2>${e(v.label)}</h2>`;
    for(const d of docs)
      h += `<a data-route="view/${e(d.view)}/${e(d.slug)}" title="${e(d.title)}"
             data-t="${e((d.title+' '+d.path).toLowerCase())}">${e(d.short||d.title)}<small>${e(d.path)}</small></a>`;
  }
  nav.innerHTML=h;
  const prefetch=a=>{
    const r=a.dataset.route||'';
    if(!r.startsWith('view/')||prefetched.has(r)) return;
    prefetched.add(r);
    // Warms the server's page cache and the browser's, so the click is a
    // conditional request instead of a render.
    fetch(themedUrl('/'+r),{cache:'force-cache'}).catch(()=>{});
  };
  nav.querySelectorAll('a').forEach(a=>{
    a.onclick=ev=>{ev.preventDefault(); go(a.dataset.route);};
    a.addEventListener('mouseenter',()=>prefetch(a),{passive:true});
    a.addEventListener('focus',()=>prefetch(a));
  });
  $('#navfilter').oninput=ev=>{
    const t=ev.target.value.toLowerCase();
    nav.querySelectorAll('a').forEach(a=>a.style.display=(!t||a.dataset.t.includes(t))?'':'none');
    nav.querySelectorAll('h2').forEach(x=>x.style.display=t?'none':'');
  };
  route();
}

/* ---- search ---------------------------------------------------------- */
let timer=null, searchAbort=null;
qIn.oninput=()=>{ clearTimeout(timer); const q=qIn.value.trim();
  if(q.length<2){ if(current) showFrame(`/view/${current.view}${current.slug?'/'+current.slug:''}`); return; }
  timer=setTimeout(()=>runSearch(q),120); };

function hl(text,q){ const i=text.toLowerCase().indexOf(q.toLowerCase());
  return i<0?e(text):e(text.slice(0,i))+'<mark>'+e(text.slice(i,i+q.length))+'</mark>'+e(text.slice(i+q.length)); }

async function runSearch(q){
  // A keystroke supersedes the request before it; letting them race made
  // results flicker back to an older query.
  if(searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  const sig = searchAbort.signal;
  let decls, text;
  try{
    [decls, text] = await Promise.all([
      fetch('/api/xref?q='+encodeURIComponent(q)+'&limit=12',{signal:sig}).then(r=>r.json()),
      fetch('/api/search?q='+encodeURIComponent(q)+'&limit=40',{signal:sig}).then(r=>r.json())
    ]);
  }catch(err){ if(err.name==='AbortError') return; throw err; }
  hits=[]; let h='';
  if(decls.names && decls.names.length){
    h+='<div class="group">Declarations</div>';
    decls.names.forEach(n=>{ hits.push({kind:'decl', name:n.name});
      h+=`<div class="hit" data-i="${hits.length-1}"><div class="d"><code>${hl(n.name,q)}</code></div>
          <div class="f">${n.occurrences} mention(s) in ${n.documents} ledger(s)</div></div>`; });
  }
  if(text.hits && text.hits.length){
    h+=`<div class="group">In ledger text${text.truncated?' (first '+text.hits.length+')':''}</div>`;
    text.hits.forEach(x=>{ hits.push({kind:'row', view:x.view, slug:x.slug});
      h+=`<div class="hit" data-i="${hits.length-1}"><div class="d">${e(x.document)}</div>
          <div class="f">${e(x.field)}</div><div class="x">${hl(x.excerpt,q)}</div></div>`; });
  }
  if(!hits.length) return showPane(`<div class="empty">Nothing matches <code>${e(q)}</code>.</div>`);
  crumb.innerHTML=`<b>Search</b><span class="chip a">${hits.length} result(s) for “${e(q)}”</span><span class="chip">↑↓ then Enter</span>`;
  showPane(h);
  cursor=-1;
  pane.querySelectorAll('.hit').forEach(d=>d.onclick=()=>open_(+d.dataset.i));
}
function open_(i){ const x=hits[i]; if(!x) return;
  if(x.kind==='decl') go('audit/'+encodeURIComponent(x.name)); else go(`view/${x.view}/${x.slug}`); }
function moveCursor(d){ const els=[...pane.querySelectorAll('.hit')]; if(!els.length) return;
  cursor=Math.max(0,Math.min(els.length-1,cursor+d));
  els.forEach(x=>x.classList.remove('cur')); els[cursor].classList.add('cur');
  els[cursor].scrollIntoView({block:'nearest'}); }

/* ---- keyboard -------------------------------------------------------- */
addEventListener('keydown', ev=>{
  if(ev.key==='/' && document.activeElement!==qIn){ ev.preventDefault(); qIn.focus(); qIn.select(); return; }
  if(ev.key==='Escape'){ if(side.classList.contains('show')) side.classList.remove('show');
    else if(pane.classList.contains('show')&&current){ qIn.value=''; showFrame(`/view/${current.view}${current.slug?'/'+current.slug:''}`);} return; }
  if(!pane.classList.contains('show')) return;
  if(ev.key==='ArrowDown'){ ev.preventDefault(); moveCursor(1); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); moveCursor(-1); }
  else if(ev.key==='Enter'&&cursor>=0){ ev.preventDefault(); open_(+pane.querySelectorAll('.hit')[cursor].dataset.i); }
});

/* ---- messages from a viewer frame ------------------------------------ */
addEventListener('message', ev=>{
  const m=ev.data||{};
  if(m.aiq==='declaration') go('decl/'+encodeURIComponent(m.name));
  else if(m.aiq==='audit') go('audit/'+encodeURIComponent(m.name));
  else if(m.aiq==='focus-search'){ qIn.focus(); qIn.select(); }
});

/* ---- buttons + live -------------------------------------------------- */
$('#sharedBtn').onclick=()=>go('shared');
$('#journalBtn').onclick=()=>go('journal');
$('#reloadBtn').onclick=()=>loadCatalog(true);

function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/live');
  ws.onopen=()=>$('#live').classList.add('on');
  ws.onclose=()=>{ $('#live').classList.remove('on'); setTimeout(connect,2000); };
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    bar.style.display='block';
    bar.textContent = m.kind==='edited' ? 'Annotation written — reloading.' : 'Changed on disk: '+(m.files||[]).join(', ');
    setTimeout(()=>bar.style.display='none',4000);
    if(current && !pane.classList.contains('show'))
      frame.src=themedUrl(`/view/${current.view}${current.slug?'/'+current.slug:''}`)+`&t=${Date.now()}`;
  };
}
frame.addEventListener('load', pushTheme);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(theme==='system') pushTheme(); });
loadCatalog(false).then(()=>{ connect(); pollReadiness(); });
</script>
