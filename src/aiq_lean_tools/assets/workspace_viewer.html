<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{color-scheme:light dark;--b:#8885;--p:#8881;--m:#777}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--b);position:sticky;top:0;background:color-mix(in srgb,Canvas 92%,transparent);backdrop-filter:blur(10px);z-index:5}h1{margin:0;font-size:22px}main{padding:20px;max-width:1600px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{border:1px solid var(--b);border-radius:8px;padding:12px}.big{font-size:26px;font-weight:700}.muted{color:var(--m)}section{margin:26px 0}table{width:100%;border-collapse:collapse}th,td{padding:7px 9px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}code{font-family:ui-monospace,monospace}.bar{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--b);border-radius:999px;padding:3px 8px}details{border:1px solid var(--b);border-radius:8px;padding:8px 12px;margin:8px 0}summary{cursor:pointer;font-weight:600}.row{padding:8px 0;border-top:1px solid var(--b)}.row:first-of-type{border-top:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select{padding:7px;border:1px solid var(--b);border-radius:6px;background:Canvas;color:CanvasText}
</style></head><body><header><h1 id="title"></h1><div class="muted" id="subtitle"></div></header><main>
<div class="cards" id="cards"></div><section><h2>Aggregate result state</h2><div id="aggregates"></div></section><section><h2>Censuses</h2><div id="censuses"></div></section><section><h2>Cross-paper declaration reuse</h2><table><thead><tr><th>declaration</th><th>documents</th></tr></thead><tbody id="reuse"></tbody></table></section><section><h2>Result explorer</h2><div class="filters"><input id="search" type="search" placeholder="filter all result rows"><select id="doc"><option value="">all documents</option></select></div><div id="results"></div></section>
</main><script type="application/json" id="payload">__PAYLOAD__</script><script>
const d=JSON.parse(document.getElementById('payload').textContent), e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('title').textContent=d.manifest?.project_name||d.root;document.getElementById('subtitle').textContent=d.root;
const cards=[['censuses',d.census_count],['result rows',d.result_rows],['semantic reviews',d.semantic_review_count],['cited declarations',d.unique_cited_declarations],['cross-document reused',d.cross_document_reuse.length]];document.getElementById('cards').innerHTML=cards.map(([k,v])=>`<div class="card"><div class="big">${e(v)}</div><div class="muted">${e(k)}</div></div>`).join('');
function pills(obj){return '<div class="bar">'+Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="pill"><code>${e(k)}</code> ${e(v)}</span>`).join('')+'</div>'}document.getElementById('aggregates').innerHTML='<h3>Status</h3>'+pills(d.status)+'<h3>Verification</h3>'+pills(d.verification)+'<h3>Importance</h3>'+pills(d.importance)+'<h3>Semantic alignment</h3>'+pills(d.semantic_alignment);
document.getElementById('censuses').innerHTML=(d.censuses||[]).map(c=>`<details><summary>${e(c.title)} <span class="muted">${e(c.items)} rows · ${e(c.path)}</span></summary><h4>Status</h4>${pills(c.status)}<h4>Verification</h4>${pills(c.verification)}<h4>Alignment</h4>${pills(c.semantic_alignment)}</details>`).join('');document.getElementById('reuse').innerHTML=(d.cross_document_reuse||[]).slice(0,200).map(r=>`<tr><td><code>${e(r.declaration)}</code></td><td>${r.documents.map(x=>`<code>${e(x)}</code>`).join('<br>')}</td></tr>`).join('');
const flat=[];for(const c of d.census_rows||[]){for(const r of c.rows||[])flat.push({document:c.document,paper:c.title,row:r});}const docsel=document.getElementById('doc');[...new Set(flat.map(x=>x.document))].sort().forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;docsel.appendChild(o)});const search=document.getElementById('search'),results=document.getElementById('results');function render(){const q=search.value.toLowerCase(),dv=docsel.value;results.innerHTML=flat.filter(x=>(!dv||x.document===dv)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).map(x=>{const r=x.row,a=r.semantic_alignment?.classification||'';return `<details><summary><code>${e(r.id)}</code> ${e(r.title||r.source_anchor||'')} <span class="muted">${e(x.document)}</span></summary><div class="row"><strong>Status:</strong> <code>${e(r.status)}</code> · <strong>verification:</strong> <code>${e(r.verification)}</code> · <strong>alignment:</strong> <code>${e(a)}</code></div>${r.source_claim?`<div class="row"><strong>Source claim.</strong> ${e(r.source_claim)}</div>`:''}${r.summary?`<div class="row"><strong>Summary.</strong> ${e(r.summary)}</div>`:''}${r.semantic_alignment?.detail?`<div class="row"><strong>Alignment.</strong> ${e(r.semantic_alignment.detail)}</div>`:''}${r.lean_declarations?.length?`<div class="row"><strong>Lean.</strong><br>${r.lean_declarations.map(z=>`<code>${e(z)}</code>`).join('<br>')}</div>`:''}${r.next_action?`<div class="row"><strong>Next action.</strong> ${e(r.next_action)}</div>`:''}</details>`}).join('')}search.addEventListener('input',render);docsel.addEventListener('input',render);render();
</script></body></html>
