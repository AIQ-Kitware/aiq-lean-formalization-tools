<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>:root{color-scheme:light dark;--b:#8885;--m:#777}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--b);position:sticky;top:0;background:Canvas;z-index:5}h1{margin:0;font-size:22px}main{padding:20px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card,details{border:1px solid var(--b);border-radius:8px;padding:10px 12px}.big{font-size:26px;font-weight:700}.muted{color:var(--m)}section{margin:26px 0}.bar{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--b);border-radius:999px;padding:3px 8px}details{margin:8px 0}summary{cursor:pointer;font-weight:600}.row{padding:8px 0;border-top:1px solid var(--b)}code{font-family:ui-monospace,monospace}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select{padding:7px;border:1px solid var(--b);border-radius:6px;background:Canvas;color:CanvasText}input{min-width:260px}.bad{font-weight:700}.deps{display:flex;gap:6px;flex-wrap:wrap}</style></head><body><header><h1>Foundation campaign map</h1><div class="muted" id="desc"></div></header><main><div class="cards" id="cards"></div><section><h2>Campaigns</h2><div id="campaigns"></div></section><section><h2>Nodes</h2><div class="filters"><input id="search" type="search" placeholder="filter nodes"><select id="kind"><option value="">all kinds</option></select></div><div id="nodes"></div></section><section><h2>Findings</h2><div id="findings"></div></section></main><script type="application/json" id="payload">__PAYLOAD__</script><script>
const d=JSON.parse(document.getElementById('payload').textContent),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s=d.summary;document.getElementById('desc').textContent=d.description||s.title;const cards=[['nodes',s.nodes],['source present',`${s.source_present}/${s.nodes}`],['campaigns',s.campaigns],['errors',s.errors],['warnings',s.warnings]];document.getElementById('cards').innerHTML=cards.map(([k,v])=>`<div class="card"><div class="big">${e(v)}</div><div class="muted">${e(k)}</div></div>`).join('');const byId=Object.fromEntries(d.nodes.map(n=>[n.id,n]));document.getElementById('campaigns').innerHTML=(d.campaigns||[]).map(c=>`<details><summary>${e(c.title)} <code>${e(c.id)}</code></summary><div class="row">${(c.nodes||[]).map(x=>`<code>${e(x)}</code>`).join(' ')||'<span class="muted">no nodes</span>'}</div></details>`).join('')||'<div class="muted">No campaigns declared.</div>';const kind=document.getElementById('kind');Object.keys(s.kinds||{}).forEach(k=>kind.insertAdjacentHTML('beforeend',`<option>${e(k)}</option>`));const search=document.getElementById('search'),nodes=document.getElementById('nodes');function render(){const q=search.value.toLowerCase(),k=kind.value;nodes.innerHTML=d.nodes.filter(n=>(!k||n.kind===k)&&(!q||JSON.stringify(n).toLowerCase().includes(q))).map(n=>`<details><summary><code>${e(n.id)}</code> ${e(n.title)} ${n.source_present?'':'<span class="bad">source missing</span>'}</summary><div class="row"><b>Kind.</b> <code>${e(n.kind)}</code>${n.confidence?` · confidence ${e(n.confidence)}`:''} · Lean ${n.lean_probe===true?'yes':n.lean_probe===false?'no':'not probed'}</div><div class="row"><b>Declaration.</b> <code>${e(n.declaration)}</code><br><span class="muted">${e(n.file)} · ${e(n.module)}</span></div><div class="row"><b>Depends on.</b> <span class="deps">${(n.dependencies||[]).map(x=>`<code>${e(x)}</code>`).join(' ')||'(root)'}</span></div>${n.frontier_nodes?.length?`<div class="row"><b>External/frontier.</b> ${(n.frontier_nodes||[]).map(x=>`<code>${e(x)}</code>`).join(' ')}</div>`:''}${n.notes?`<div class="row">${e(n.notes)}</div>`:''}</details>`).join('')||'<div class="muted">No matching nodes.</div>'}search.addEventListener('input',render);kind.addEventListener('change',render);render();document.getElementById('findings').innerHTML=(d.findings||[]).map(f=>`<div class="row"><b>${e(f.level.toUpperCase())}</b> <code>${e(f.code)}</code> ${f.location?`<code>${e(f.location)}</code> `:''}${e(f.message)}</div>`).join('')||'<div class="muted">No findings.</div>';
</script></body></html>
