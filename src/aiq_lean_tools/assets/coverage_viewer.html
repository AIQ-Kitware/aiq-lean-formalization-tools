<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>:root{color-scheme:light dark;--b:#8885;--m:#777}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--b);position:sticky;top:0;background:Canvas;z-index:5}h1{margin:0;font-size:22px}main{padding:20px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card,details{border:1px solid var(--b);border-radius:8px;padding:10px 12px}.big{font-size:26px;font-weight:700}.muted{color:var(--m)}section{margin:26px 0}.bar{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--b);border-radius:999px;padding:3px 8px}details{margin:8px 0}summary{cursor:pointer;font-weight:600}.row{padding:8px 0;border-top:1px solid var(--b)}code{font-family:ui-monospace,monospace}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input{min-width:260px;padding:7px;border:1px solid var(--b);border-radius:6px;background:Canvas;color:CanvasText}</style></head><body><header><h1>Formalization coverage</h1><div class="muted" id="paths"></div></header><main><div class="cards" id="cards"></div><section><h2>Result states</h2><div id="states"></div></section><section><h2>Result explorer</h2><div class="filters"><input id="result-search" type="search" placeholder="filter counted results"></div><div id="results"></div></section><section><h2>Source-fidelity atoms</h2><div class="filters"><input id="atom-search" type="search" placeholder="filter source atoms"></div><div id="atoms"></div></section></main><script type="application/json" id="payload">__PAYLOAD__</script><script>
const d=JSON.parse(document.getElementById('payload').textContent),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s=d.summary;document.getElementById('paths').textContent=d.results_path+(d.atoms_path?' · '+d.atoms_path:'');const cards=[['results',s.results],['obligations',s.completion_obligations],['Lean declarations',s.unique_lean_declarations],['source atoms',s.source_atoms?.atoms??0]];document.getElementById('cards').innerHTML=cards.map(([k,v])=>`<div class="card"><div class="big">${e(v)}</div><div class="muted">${e(k)}</div></div>`).join('');function pills(obj){return '<div class="bar">'+Object.entries(obj||{}).map(([k,v])=>`<span class="pill"><code>${e(k)}</code> ${e(v)}</span>`).join('')+'</div>'}document.getElementById('states').innerHTML=['dispositions','verification','semantic_certification','semantic_alignment'].map(k=>Object.keys(s[k]||{}).length?`<h3>${e(k.replaceAll('_',' '))}</h3>${pills(s[k])}`:'').join('');function resultHtml(r){const atoms=r.source_atom_ids||r.source_fidelity_atom_ids||[],decls=r.lean_declarations||r.review_declarations||[];return `<details><summary><code>${e(r.id)}</code> ${e(r.title||r.source_anchor||'')}</summary><div class="row"><b>Source.</b> ${e(r.source_anchor||'')}</div><div class="row"><b>State.</b> <code>${e(r.disposition||r.status||'')}</code> · <code>${e(r.verification||'')}</code> · <code>${e(r.semantic_certification||'')}</code></div><div class="row"><b>Atoms.</b> ${atoms.map(x=>`<code>${e(x)}</code>`).join(' ')}</div><div class="row"><b>Lean.</b><br>${decls.map(x=>`<code>${e(x)}</code>`).join('<br>')}</div>${r.review_note?`<div class="row"><b>Review.</b> ${e(r.review_note)}</div>`:''}</details>`}function atomHtml(a){return `<details><summary><code>${e(a.id)}</code> ${e(a.summary||'')}</summary><div class="row"><b>Source.</b> ${e(a.source_locator||'')}</div><div class="row"><b>Role.</b> <code>${e(a.formalization_role||'')}</code> · <code>${e(a.formalization_role_reason_code||'')}</code></div><div class="row"><b>Results.</b> ${(a.formalization_result_ids||[]).map(x=>`<code>${e(x)}</code>`).join(' ')}</div>${a.formalization_role_reason?`<div class="row">${e(a.formalization_role_reason)}</div>`:''}</details>`}const rs=document.getElementById('result-search'),as=document.getElementById('atom-search'),ro=document.getElementById('results'),ao=document.getElementById('atoms');function renderResults(){const q=rs.value.toLowerCase();ro.innerHTML=(d.results||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).map(resultHtml).join('')}function renderAtoms(){const q=as.value.toLowerCase();ao.innerHTML=(d.atoms||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).map(atomHtml).join('')||'<div class="muted">No linked source-atom inventory.</div>'}rs.addEventListener('input',renderResults);as.addEventListener('input',renderAtoms);renderResults();renderAtoms();
</script></body></html>
