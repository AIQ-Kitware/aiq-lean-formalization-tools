<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>body{font:14px/1.45 system-ui,sans-serif;margin:24px;max-width:1500px}input{padding:8px;width:min(600px,100%);margin:8px 0 18px}article{border:1px solid #8885;border-radius:8px;padding:14px 16px;margin:12px 0}code{font-family:ui-monospace,monospace}table{width:100%;border-collapse:collapse}th,td{border:1px solid #8885;padding:6px;vertical-align:top;text-align:left}.meta{color:#777}</style></head><body><h1 id="title"></h1><input id="search" type="search" placeholder="filter rows"><div id="rows"></div>
<script type="application/json" id="payload">__PAYLOAD__</script><script>
const p=JSON.parse(document.getElementById('payload').textContent), rows=p.data.rows||[], root=document.getElementById('rows'), q=document.getElementById('search');document.getElementById('title').textContent=p.title+' — semantic alignment review';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){root.innerHTML='';const needle=q.value.toLowerCase();for(const r of rows){if(needle&&!JSON.stringify(r).toLowerCase().includes(needle))continue;const a=document.createElement('article');let h=`<h2><code>${e(r.id)}</code> — ${e(r.title)}</h2><p class="meta">${e(r.source_anchor)} · ${e(r.importance||'')} · ${e(r.verdict||'')}</p>`;if(r.source_claim)h+=`<p><strong>Source claim.</strong> ${e(r.source_claim)}</p>`;if(r.lean_declarations?.length)h+=`<p><strong>Lean declarations.</strong> ${r.lean_declarations.map(x=>`<code>${e(x)}</code>`).join(', ')}</p>`;if(r.clauses?.length){h+='<table><thead><tr><th>source</th><th>Lean</th><th>relation</th><th>note</th></tr></thead><tbody>'+r.clauses.map(c=>`<tr><td>${e(c.source_clause)}</td><td>${e(c.lean_clause)}</td><td><code>${e(c.relation)}</code></td><td>${e(c.note||'')}</td></tr>`).join('')+'</tbody></table>';}if(r.review)h+=`<p><strong>Review.</strong> ${e(r.review)}</p>`;if(r.next_action)h+=`<p><strong>Next action.</strong> ${e(r.next_action)}</p>`;a.innerHTML=h;root.appendChild(a);}}q.addEventListener('input',render);render();</script></body></html>
