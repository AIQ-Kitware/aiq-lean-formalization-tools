<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f2328;--muted:#6a6f76;--line:#d8d5ce;--panel:#f3f1ec;--accent:#1f5fa8;--ok:#2f7d4e;--warn:#a86a12;--bad:#b23a2e;--code:#f5f3ee;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#e7e5e0;--muted:#9a9ea5;--line:#33373d;--panel:#1d2024;--accent:#86aee8;--ok:#7fc79a;--warn:#e0a94f;--bad:#ee8a7e;--code:#1a1d21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#e7e5e0;--muted:#9a9ea5;--line:#33373d;--panel:#1d2024;--accent:#86aee8;--ok:#7fc79a;--warn:#e0a94f;--bad:#ee8a7e;--code:#1a1d21;color-scheme:dark}
body{margin:0;font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header .meta{color:var(--muted)}
main{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 60px)}
nav{border-right:1px solid var(--line);padding:12px;overflow:auto;position:sticky;top:0;height:100vh;box-sizing:border-box}
nav input{width:100%;box-sizing:border-box;padding:7px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
nav h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
nav a{display:block;padding:5px 7px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:13px}
nav a:hover,nav a.active{background:var(--panel)}
nav a .b{float:right}
section.row{padding:18px 26px;border-bottom:1px solid var(--line)}
section.row h2{margin:0 0 4px;font-size:17px;text-wrap:balance}
.meta{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.warn{color:var(--warn);border-color:var(--warn)}.badge.bad{color:var(--bad);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:10px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h4{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card ul{margin:0;padding-left:18px}
pre,code{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:6px 0}
table{width:100%;border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums}th,td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left;font-size:13px}
th{background:var(--panel)}
details{margin:6px 0}summary{cursor:pointer;color:var(--accent)}summary:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.decl{border-left:3px solid var(--accent);padding-left:12px;margin:14px 0}
.decl h3{margin:0 0 4px;font-size:14px;word-break:break-all}
.tree ul{list-style:none;padding-left:16px;margin:2px 0;border-left:1px dotted var(--line)}
.tree li{margin:2px 0}.tree .via{color:var(--muted);font-size:11px;margin-right:4px}
.tree .k{color:var(--muted);font-size:11.5px}
.warnlist li{color:var(--warn)}
.chips code{display:inline-block;margin:2px 3px 2px 0;padding:1px 5px;background:var(--code);border:1px solid var(--line);border-radius:4px}
.hash{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-style:italic}
</style></head><body>
<header><h1 id="title"></h1><span class="meta" id="subtitle"></span></header>
<main><nav><input id="search" type="search" placeholder="filter rows and declarations"><div id="nav"></div></nav><div id="rows"></div></main>
<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
const P=JSON.parse(document.getElementById('payload').textContent);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=P.records||{};
document.getElementById('title').textContent=P.title;
const meta=[];if(P.statementMeta&&P.statementMeta.toolchain)meta.push('toolchain '+P.statementMeta.toolchain);if(P.generated)meta.push('generated '+P.generated);if(P.graph)meta.push('proof graph: '+P.graph.nodeCount+' declarations');
document.getElementById('subtitle').textContent=meta.join(' · ');
const pinClass={current:'ok','text-drift':'warn',drift:'bad',gone:'bad',unpinned:''};
function short(n){return n.split('.').slice(-2).join('.');}
function chips(list){return list&&list.length?'<span class="chips">'+list.map(x=>`<code title="${e(x)}">${e(x)}</code>`).join('')+'</span>':'<span class="empty">none</span>';}
function treeNode(name,via,seen,depth){const r=R[name];const v=via?`<span class="via">[${via}]</span>`:'';if(!r)return `<li>${v}<code>${e(name)}</code> <span class="k">(no record)</span></li>`;if(r.missing)return `<li>${v}<code>${e(name)}</code> <span class="k">(not in environment)</span></li>`;if(seen.has(name))return `<li>${v}<code>${e(name)}</code> <span class="k">(above)</span></li>`;seen.add(name);const kind=(r.flags||[]).includes('class')?'class':(r.flags||[]).includes('structure')?'structure':r.kind;const plumb=(r.flags||[]).includes('instance')||(r.flags||[]).includes('projection')||r.kind==='ctor';if(r.boundary&&depth>0)return `<li>${v}<code>${e(name)}</code> <span class="k">(${e(kind)}, ${e(r.library||'')})</span>${r.docstring?`<details><summary>doc</summary><div>${e(r.docstring)}</div></details>`:''}</li>`;let h=`<li>${v}<code>${e(name)}</code> <span class="k">(${e(kind)}, ${e(r.module)}:${r.line||''})</span>`;const expands=(r.kind==='def'||r.kind==='inductive')&&(depth===0||!r.boundary);h+=`<details${depth<2?' open':''}><summary>signature</summary><pre>${e(r.signature||r.type)}</pre>`;if(r.fields&&r.fields.length)h+='<ul>'+r.fields.map(f=>`<li><code>${e(f.name)}</code> : <code>${e((f.type||'').replace(/\s+/g,' '))}</code></li>`).join('')+'</ul>';if(r.docstring)h+=`<div class="meta">${e(r.docstring)}</div>`;h+='</details>';if(expands){const kids=(r.typeDeps||[]).map(d=>[d,'type']).concat((r.bodyDeps||[]).filter(d=>!(r.typeDeps||[]).includes(d)).map(d=>[d,'body']));const plumbing=[],rest=[];for(const [d,w] of kids){const c=R[d];if(c&&!c.missing&&((c.flags||[]).includes('instance')||(c.flags||[]).includes('projection')||c.kind==='ctor'))plumbing.push(d);else rest.push([d,w]);}if(rest.length)h+='<ul>'+rest.map(([d,w])=>treeNode(d,w,seen,depth+1)).join('')+'</ul>';if(plumbing.length)h+=`<div class="k">via instances/projections: ${plumbing.map(e).join(', ')}</div>`;}return h+'</li>';}
function declBlock(d){let h=`<div class="decl"><h3><code>${e(d.name)}</code> <span class="badge ${pinClass[d.pinStatus]||''}">pin: ${e(d.pinStatus||'n/a')}</span>`;if(d.source)h+=` <span class="meta">${e(d.source.path)}:${d.source.line}</span>`;h+='</h3>';if(d.signature)h+=`<pre>${e(d.signature)}</pre>`;else if(d.source&&d.source.text)h+=`<details><summary>human-written statement</summary><pre>${e(d.source.text)}</pre></details>`;if(d.hashes)h+=`<div class="hash">structural type hash ${e(d.hashes.expr)} · printed-type hash ${e((d.hashes.text||'').slice(0,16))}${d.pin?` · pinned ${e(d.pin.pinned_on||'?')}${d.pin.note?' — '+e(d.pin.note):''}`:''}</div>`;if(d.docstring)h+=`<div class="meta">${e(d.docstring)}</div>`;if(d.closure){const s=d.closure.summary;h+='<div class="grid">';h+=d.hasDictionary?`<div class="card"><h4>Undisclosed project constants</h4>${d.undisclosed.length?'<ul class="warnlist">'+d.undisclosed.map(x=>`<li><code>${e(x)}</code></li>`).join('')+'</ul>':'<span class="empty">every project constant in the statement closure is in the dictionary</span>'}</div>`:`<div class="card"><h4>Project constants in the statement</h4><span class="meta">no local semantic dictionary recorded for this row</span>${chips(d.undisclosed)}</div>`;h+=`<div class="card"><h4>Statement closure</h4>${s.unfolded.length} project constant(s) unfolded, ${s.leaves.length} leaf/leaves, ${s.boundary.length} boundary, ${s.plumbing.length} plumbing${s.unknown.length?', <span class="badge bad">'+s.unknown.length+' unknown</span>':''}${d.unreachableDictionary.length?'<div>Dictionary definitions never reached: '+chips(d.unreachableDictionary)+'</div>':''}</div>`;h+=`<div class="card"><h4>Boundary vocabulary</h4>${chips(s.boundary)}</div>`;h+='</div>';h+=`<details><summary>statement closure tree</summary><div class="tree"><ul>${treeNode(d.name,'',new Set(),0)}</ul></div></details>`;}if(d.proof){const p=d.proof;h+=`<details><summary>proof dependencies: ${p.nodeCount} project declaration(s), ${p.edgeCount} edge(s)</summary><div class="grid"><div class="card"><h4>By library</h4><ul>${Object.entries(p.byLibrary).map(([k,v])=>`<li>${e(k)}: ${v}</li>`).join('')}</ul></div><div class="card"><h4>Direct dependencies</h4><ul>${p.direct.map(x=>`<li><span class="badge ${x.role==='type'?'ok':''}">${e(x.role)}</span> <code>${e(x.name)}</code> <span class="k">${e(x.kind)}</span></li>`).join('')||'<li class="empty">none in project</li>'}</ul></div>${p.axioms?`<div class="card"><h4>Axioms</h4>${chips(p.axioms)}</div>`:''}</div><details><summary>by module</summary><table><tr><th>module</th><th>declarations</th></tr>${p.byModule.map(([m,c])=>`<tr><td><code>${e(m)}</code></td><td>${c}</td></tr>`).join('')}</table></details></details>`;}return h+'</div>';}
function rowBlock(r){let h=`<section class="row" id="${e(r.anchor)}"><h2>${e(r.title)} <span class="badge">${e(r.importance||'')}</span> ${r.pinSummary?`<span class="badge ${pinClass[r.pinSummary]||''}">${e(r.pinSummary)}</span>`:''}</h2><div class="meta">${e(r.paper)} · <code>${e(r.id)}</code> · ${e(r.sourceAnchor||'')} · status ${e(r.status||'')} · verification ${e(r.verification||'')}</div>`;if(r.claim)h+=`<p>${e(r.claim)}</p>`;const ss=r.sourceStatement;if(ss){h+='<div class="grid">';for(const k of ['setup','hypotheses','conclusions','scope']){if(ss[k]&&ss[k].length)h+=`<div class="card"><h4>${k}</h4><ul>${ss[k].map(x=>`<li>${e(x)}</li>`).join('')}</ul></div>`;}h+='</div>';}if(r.clauses&&r.clauses.length)h+='<table><tr><th>source clause</th><th>Lean realization</th><th>status</th></tr>'+r.clauses.map(c=>`<tr><td>${e(c.source_clause)}</td><td>${e(c.lean_realization||c.lean_clause)}</td><td><code>${e(c.status||c.relation)}</code></td></tr>`).join('')+'</table>';h+='<h3>Canonical declarations</h3>'+(r.canonical.length?r.canonical.map(declBlock).join(''):'<p class="empty">none</p>');if(r.supporting.length)h+=`<details><summary>supporting declarations (${r.supporting.length})</summary><ul>${r.supporting.map(s=>`<li><code>${e(s.name)}</code> <span class="badge">${e(s.status)}</span></li>`).join('')}</ul></details>`;if(r.context.length)h+=`<details><summary>local semantic dictionary (${r.context.length})</summary><table><tr><th>declaration</th><th>role</th><th>kind</th></tr>${r.context.map(c=>`<tr><td><code>${e(c.name)}</code></td><td>${e(c.role)}</td><td>${e(c.kind||'')}${c.reachable===false?' <span class="badge warn">not in any statement closure</span>':''}</td></tr>`).join('')}</table></details>`;if(r.note)h+=`<p><strong>Review note.</strong> ${e(r.note)}</p>`;if(r.nextAction)h+=`<p><strong>Next action.</strong> ${e(r.nextAction)}</p>`;for(const v of r.variants||[]){h+=`<h3>Derived variant: ${e(v.title)}</h3>${v.claim?`<p>${e(v.claim)}</p>`:''}${v.canonical.map(declBlock).join('')}`;}return h+'</section>';}
const rowsEl=document.getElementById('rows'),navEl=document.getElementById('nav'),q=document.getElementById('search');
function render(){const needle=q.value.toLowerCase();rowsEl.innerHTML='';navEl.innerHTML='';for(const paper of P.papers){const rows=paper.rows.filter(r=>!needle||JSON.stringify(r).toLowerCase().includes(needle));if(!rows.length)continue;navEl.innerHTML+=`<h3>${e(paper.title)}</h3>`+rows.map(r=>`<a href="#${e(r.anchor)}">${e(r.title)} ${r.pinSummary?`<span class="badge b ${pinClass[r.pinSummary]||''}">${e(r.pinSummary)}</span>`:''}</a>`).join('');for(const r of rows)rowsEl.innerHTML+=rowBlock(r);}}
q.addEventListener('input',render);render();
</script></body></html>
