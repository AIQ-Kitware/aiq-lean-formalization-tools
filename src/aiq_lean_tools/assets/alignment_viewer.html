<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{
  --bg:#fbfaf7;--fg:#1f2328;--muted:#6a6f76;--line:#d8d5ce;--panel:#f3f1ec;--panel2:#eceae4;
  --accent:#1f5fa8;--ok:#2f7d4e;--warn:#a86a12;--bad:#b23a2e;--code:#f5f3ee;
  --mark:#fff2a8;--src:#f7f4ec;--sel:#e4edf8;color-scheme:light
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a;--fg:#e7e5e0;--muted:#9a9ea5;--line:#33373d;--panel:#1d2024;--panel2:#23272c;
  --accent:#86aee8;--ok:#7fc79a;--warn:#e0a94f;--bad:#ee8a7e;--code:#1a1d21;
  --mark:#5a4c1c;--src:#1b1e22;--sel:#22303f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a;--fg:#e7e5e0;--muted:#9a9ea5;--line:#33373d;--panel:#1d2024;--panel2:#23272c;
  --accent:#86aee8;--ok:#7fc79a;--warn:#e0a94f;--bad:#ee8a7e;--code:#1a1d21;
  --mark:#5a4c1c;--src:#1b1e22;--sel:#22303f;color-scheme:dark}

body{margin:0;font:14px/1.55 'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header.top{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
header.top h1{font-size:17px;margin:0}
.meta{color:var(--muted);font-size:12.5px}
main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 52px)}
nav{border-right:1px solid var(--line);padding:12px;overflow:auto;position:sticky;top:52px;height:calc(100vh - 52px);box-sizing:border-box}
nav input{width:100%;box-sizing:border-box;padding:7px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
nav h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
nav a{display:block;padding:5px 7px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:13px;cursor:pointer}
nav a:hover{background:var(--panel)}
nav a.sel{background:var(--sel)}
#rows{min-width:0}

section.row{border-bottom:1px solid var(--line);padding:14px 20px 22px;scroll-margin-top:56px}
section.row>h2{margin:0 0 3px;font-size:17px;text-wrap:balance;cursor:pointer}
section.row>h2::before{content:"\25be ";color:var(--muted)}
section.row.closed>h2::before{content:"\25b8 ";}
section.row.closed .lanes,section.row.closed .claim{display:none}
.claim{margin:8px 0 12px;max-width:78ch}

.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
.badge.mech{border-style:solid;color:var(--accent);border-color:var(--accent)}
.badge.human{border-style:dashed}
.renditions{display:flex;gap:0;margin:4px 0 8px}
.renditions .rendition{font:inherit;font-size:11px;padding:2px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.renditions .rendition:first-child{border-radius:5px 0 0 5px}
.renditions .rendition:last-child{border-radius:0 5px 5px 0;border-left:0}
.renditions .rendition.on{background:var(--panel);color:var(--fg);border-color:var(--accent)}
.badge.loud{font-weight:600;background:var(--bad);color:var(--bg);border-color:var(--bad)}
.axes{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 2px;font-size:11px;color:var(--muted)}
.axes b{font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-right:5px}

.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.lane{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.lane>h3{margin:0;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);background:var(--panel2);border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center;justify-content:space-between;cursor:pointer}
.lane>h3 .wide{border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.lanes.wide-0 .lane:nth-child(1),.lanes.wide-1 .lane:nth-child(2),.lanes.wide-2 .lane:nth-child(3){grid-column:1/-1}
.lanes.wide-0 .lane:not(:nth-child(1)),.lanes.wide-1 .lane:not(:nth-child(2)),.lanes.wide-2 .lane:not(:nth-child(3)){display:none}
.lane .inner{padding:10px 12px;max-height:78vh;overflow:auto}

.card{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:9px 11px;margin:0 0 10px}
.card.primary{border-left:3px solid var(--accent)}
.card.inherited{border-left:3px solid var(--warn)}
.card h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card.hit{outline:2px solid var(--accent);outline-offset:2px}

.frag .prose{margin:6px 0;max-width:70ch}
.frag .display{margin:9px 0;overflow-x:auto;overflow-y:hidden;text-align:center}
.frag .display .tag{float:right;color:var(--muted);font-size:12px}
.frag .anchor{color:var(--muted);font-size:12.5px;font-style:italic}
.frag h5{margin:2px 0 6px;font-size:13.5px}
.frag li{margin:3px 0}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

.clause{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:0 0 9px;background:var(--bg);cursor:pointer}
.clause:hover{border-color:var(--accent)}
.clause.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--sel)}
.clause .src{margin:0 0 6px}
.clause .arrow{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:5px 0 3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.clause .lean{margin:0;color:var(--fg)}
/* Lean names are long and unbreakable; without this they set the column width
   and everything to their right is clipped. */
.clause .src,.clause .lean,.clause .why,.card .meta,.decl>.h code,.tabpanel .meta{overflow-wrap:anywhere}
.clause .why{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.clause .ev{margin-top:6px}
.clause .ev code{cursor:pointer}
.kindhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 5px}
.kindhead:first-child{margin-top:0}

.note{border-left:3px solid var(--warn);background:var(--panel2);padding:7px 10px;border-radius:0 6px 6px 0;margin:0 0 10px;font-size:13px}
.note.info{border-left-color:var(--accent)}
.note .why{margin:6px 0 0;color:var(--muted)}
.note ul{margin:6px 0 0;padding-left:18px}
.note ul code{cursor:pointer}

.decl{border:1px solid var(--line);border-radius:7px;margin:0 0 11px;background:var(--bg);overflow:hidden}
.decl.hit{outline:2px solid var(--accent);outline-offset:2px}
.decl>.h{padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.decl>.h code{font-size:12px;word-break:break-all;font-weight:600}
.tabs{display:flex;gap:2px;padding:5px 8px 0;flex-wrap:wrap;background:var(--panel2);border-bottom:1px solid var(--line)}
.tabs button{border:1px solid transparent;border-bottom:none;background:none;color:var(--muted);
  font:inherit;font-size:12px;padding:3px 9px;border-radius:5px 5px 0 0;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--fg);border-color:var(--line)}
.tabpanel{padding:8px 10px}
.tabpanel[hidden]{display:none}

pre,code{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:9px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:6px 0}
pre .k{color:var(--accent)}pre .c{color:var(--muted);font-style:italic}pre .t{color:var(--ok)}pre .s{color:var(--warn)}
.hash{color:var(--muted);font-size:11.5px;word-break:break-all}
.empty{color:var(--muted);font-style:italic}
details{margin:6px 0}summary{cursor:pointer;color:var(--accent);font-size:12.5px}
summary:focus-visible,a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse;margin:6px 0}
th,td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left;font-size:12.5px}
th{background:var(--panel2)}
.chips code{display:inline-block;max-width:100%;margin:2px 3px 2px 0;padding:1px 5px;background:var(--code);border:1px solid var(--line);border-radius:4px;cursor:pointer;white-space:normal;overflow-wrap:anywhere}
.tree ul{list-style:none;padding-left:15px;margin:2px 0;border-left:1px dotted var(--line)}
.tree li{margin:2px 0}.tree .via{color:var(--muted);font-size:10.5px;margin-right:4px}
.tree .k2{color:var(--muted);font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.triage{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px}
.triage .lead{color:var(--muted);margin-right:2px}
.triage button{font:inherit;padding:3px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--muted);cursor:pointer;white-space:nowrap}
.triage button:hover{border-color:var(--accent);color:var(--fg)}
.triage button.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.triage button.alarm{color:var(--bad);border-color:var(--bad)}
.triage button.alarm.on{background:var(--bad);color:var(--bg)}
.triage button.clean{color:var(--ok);border-color:var(--ok)}
.triage .count{opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
.katex{font-size:1.03em}
.katex-display{margin:.35em 0}
@media(max-width:900px){main{grid-template-columns:1fr}nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
</style></head><body>
<header class="top">
  <h1 id="title"></h1><span class="meta" id="subtitle"></span>
  <span class="legend" style="margin-left:auto">
    <span><span class="badge mech">compiler / file</span> mechanically established</span>
    <span><span class="badge human">reviewed</span> human judgment</span>
  </span>
</header>
<main>
  <nav><input id="search" type="search" placeholder="filter rows and declarations"><div id="nav"></div></nav>
  <div><div id="triage" class="triage"></div><div id="rows"></div></div>
</main>
<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
"use strict";
const P = JSON.parse(document.getElementById('payload').textContent);
const R = P.records || {};
const MACROS = (P.sources && P.sources.macros) || {};
const RELATIONS = P.relations || {};
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- mathematics ------------------------------------------------------
   Source text is TeX, and a reviewer comparing a paper with a Lean statement
   needs to read it as mathematics.  Every formula is emitted as a placeholder
   carrying its TeX, and rendered once, when its row is first opened.        */
const HAVE_KATEX = typeof katex !== 'undefined';
function texEl(tex, display){
  return `<span class="tex" data-tex="${e(tex)}"${display?' data-display="1"':''}></span>`;
}
function renderMath(scope){
  scope.querySelectorAll('.tex[data-tex]:not([data-done])').forEach(el => {
    el.dataset.done = '1';
    const tex = el.dataset.tex;
    if (!HAVE_KATEX) { el.textContent = (el.dataset.display ? '\n' : '') + tex; el.style.fontFamily='monospace'; return; }
    try {
      katex.render(tex, el, {
        displayMode: el.dataset.display === '1', throwOnError: false, trust: false,
        macros: Object.assign({}, MACROS), strict: 'ignore',
      });
    } catch (err) { el.textContent = tex; el.style.fontFamily = 'monospace'; }
  });
}
/* Inline `$...$` inside a review's own prose, so a clause written in TeX reads
   as mathematics too. */
function inlineTex(text){
  const parts = String(text ?? '').split(/\$([^$]+)\$/g);
  return parts.map((p, i) => i % 2 ? texEl(p, false) : e(p)).join('');
}

/* ---- Lean syntax colouring -------------------------------------------- */
const LEAN_WORDS = [
 'theorem','lemma','def','abbrev','instance','structure','class','inductive','example','where',
 'by','fun','let','have','show','from','match','with','do','if','then','else','at','in','forall',
 'noncomputable','private','protected','partial','unsafe','mutual','omit','include','set_option',
 'exact','apply','intro','intros','refine','simp','simpa','rw','rwa','constructor','cases','rcases',
 'obtain','use','induction','ring','linarith','nlinarith','positivity','norm_num','field_simp',
 'unfold','change','convert','congr','ext','funext','subst','specialize','gcongr','bound','trans',
 'this','all_goals','any_goals','first','try','repeat','focus','conv','push_cast','calc'
];
/* One pass, two alternatives. Two chained `replace` calls re-scanned the markup
   the first had just inserted -- and `class` is a Lean keyword, so every
   `<span class="t">` was mangled into broken HTML. */
const LEAN_TOKEN = new RegExp('\\b(Prop|Type|Sort)\\b|\\b(' + LEAN_WORDS.join('|') + ')\\b', 'g');
function leanHl(src){
  const out=[]; let i=0;
  const push=(cls,txt)=>out.push(cls?`<span class="${cls}">${e(txt)}</span>`:e(txt));
  while(i<src.length){
    if(src.startsWith('/-',i)){const j=src.indexOf('-/',i+2);const end=j<0?src.length:j+2;push('c',src.slice(i,end));i=end;continue;}
    if(src.startsWith('--',i)){const j=src.indexOf('\n',i);const end=j<0?src.length:j;push('c',src.slice(i,end));i=end;continue;}
    if(src[i]==='"'){let j=i+1;while(j<src.length&&!(src[j]==='"'&&src[j-1]!=='\\'))j++;push('s',src.slice(i,j+1));i=j+1;continue;}
    let j=i;while(j<src.length&&!src.startsWith('/-',j)&&!src.startsWith('--',j)&&src[j]!=='"')j++;
    out.push(e(src.slice(i,j)).replace(LEAN_TOKEN,
      (m,t,k) => t ? `<span class="t">${t}</span>` : `<span class="k">${k}</span>`));
    i=j;
  }
  return out.join('');
}

/* ---- literature lane --------------------------------------------------- */
const ROLE_LABEL = {
  primary:'Printed passage', standing_assumption:'Inherited standing condition',
  definition:'Definition established elsewhere', convention:'Source convention',
  context:'Adjacent source context',
};
const SRCPIN = {current:['ok','source pinned & current'],moved:['bad','source passage moved since review'],
  unpinned:['warn','source not pinned'],unresolved:['bad','source locator does not resolve']};

function spansHtml(spans){
  return (spans||[]).map(s => {
    if (s.kind === 'math') return texEl(s.text, false);
    if (s.kind === 'code') return `<code>${e(s.text)}</code>`;
    if (s.kind === 'emph') return `<em>${e(s.text)}</em>`;
    if (s.kind === 'strong') return `<strong>${e(s.text)}</strong>`;
    return e(s.text);
  }).join('');
}
function blocksHtml(blocks){
  let h = '', list = false;
  for (const b of blocks || []) {
    if (b.kind === 'item' && !list) { h += '<ul>'; list = true; }
    if (b.kind !== 'item' && list) { h += '</ul>'; list = false; }
    if (b.kind === 'display')      h += `<div class="display">${b.tag?`<span class="tag">(${e(b.tag)})</span>`:''}${texEl(b.text, true)}</div>`;
    else if (b.kind === 'heading') h += `<h5>${spansHtml(b.spans)}</h5>`;
    else if (b.kind === 'anchor')  h += `<p class="anchor">${spansHtml(b.spans)}</p>`;
    else if (b.kind === 'item')    h += `<li>${spansHtml(b.spans)}</li>`;
    else                           h += `<p class="prose">${spansHtml(b.spans)}</p>`;
  }
  return h + (list ? '</ul>' : '');
}
/* One passage may exist in two renditions: the checked-in reconstruction the
   reviews cite, and a lawfully held local transcription of the printed paper
   overlaid on it. They are separate texts with separate hashes, so they are
   shown as alternates behind a toggle rather than merged. */
const RENDITION_LABEL = {reconstruction: 'Reconstruction', original: 'Original'};
function fragmentBody(f){
  let h = `<div class="meta">${e(f.label || f.locator.marker || '')}`
        + (f.citation ? ` · ${e(f.citation)}` : '') + `</div>`;
  if (f.withheld) h += `<p class="empty">${e(f.withheld)}</p>`;
  else h += blocksHtml(f.blocks);
  return h + `<div class="hash">${e(f.locator.file || f.document)}`
     + (f.locator.lines ? `:${f.locator.lines[0]}–${f.locator.lines[1]}` : '')
     + ` · content hash <code>${e(f.sha256.slice(0,16))}</code>`
     + (f.visibility === 'private_source' ? ' · <b>private local source</b>' : '')
     + `</div>`;
}
function fragmentCard(entry){
  const f = entry.fragment;
  const role = entry.role || 'primary';
  const cls = role === 'primary' ? 'primary' : 'inherited';
  const [pc, ptitle] = SRCPIN[entry.pinStatus] || ['', entry.pinStatus || ''];
  let h = `<div class="card frag ${cls}" data-fragment="${e(entry.id)}">`;
  h += `<h4>${e(ROLE_LABEL[role] || role)}`
     + `<span class="badge ${pc}" title="${e(ptitle)}" style="float:right">${e(entry.pinStatus||'')}</span></h4>`;
  if (!f) {
    return h + `<p class="empty">This review cites a passage that no configured source document resolves: `
      + `<code>${e(JSON.stringify(entry.unresolved||{}))}</code></p></div>`;
  }
  const renditions = [f].concat(entry.alternates || []);
  if (renditions.length > 1) {
    h += '<div class="renditions">' + renditions.map((r, i) =>
      `<button class="rendition${i ? '' : ' on'}" data-rendition="${i}">`
      + `${e(RENDITION_LABEL[r.rendition] || r.rendition || 'Rendition ' + (i + 1))}</button>`
    ).join('') + '</div>';
    h += renditions.map((r, i) =>
      `<div class="renditionBody"${i ? ' hidden' : ''} data-rendition="${i}">${fragmentBody(r)}</div>`
    ).join('');
  } else {
    h += fragmentBody(f);
  }
  if (entry.why) h += `<p class="meta">${e(entry.why)}</p>`;
  return h + '</div>';
}
function paraphraseCard(ss){
  if (!ss) return '';
  let h = '<details class="card"><summary>The review’s own normalized restatement</summary>';
  for (const k of ['setup','hypotheses','conclusions','scope']) {
    if (!ss[k] || !ss[k].length) continue;
    h += `<h4>${e(k)}</h4><ul>` + ss[k].map(x => `<li>${inlineTex(x)}</li>`).join('') + '</ul>';
  }
  return h + '</details>';
}

/* ---- correspondence lane ---------------------------------------------- */
const KIND_ORDER = ['setup','hypothesis','conclusion','scope','object','note',''];
function clauseCard(c, rowId, uncurated){
  const rel = RELATIONS[c.relation] || {};
  const evidence = (c.correspondenceDeclarations || []);
  let h = `<div class="clause" data-row="${e(rowId)}" data-clause="${c.index}"`
        + (c.sourceFragment ? ` data-fragment="${e(c.sourceFragment)}"` : '')
        + (c.sourceExcerpt ? ` data-excerpt="${e(c.sourceExcerpt)}"` : '')
        + ` data-decls="${e((c.leanDeclarations||[]).concat(evidence).join(' '))}">`;
  h += `<p class="src">${inlineTex(c.sourceClause)}</p>`;
  h += `<div class="arrow">↓ <span class="badge human" title="${e(rel.description||'reviewer judgment')}">`
     + `${e(c.relationLabel || c.relation || c.status || 'claimed')}</span>`
     + (c.status === 'open'
          ? `<span class="badge ${uncurated ? '' : 'loud'}" title="${uncurated
              ? 'no curated correspondence is registered for this row'
              : 'the correspondence is recorded but not established'}">not established</span>`
          : c.status && c.status !== 'claimed_exact' ? `<span class="badge">${e(c.status)}</span>` : '')
     + (c.leanBinder ? `<code>${e(c.leanBinder)}</code>` : '')
     + `</div>`;
  h += `<p class="lean">${inlineTex(c.leanRealization)}</p>`;
  if (evidence.length)
    h += `<div class="ev"><span class="meta">carried by</span> <span class="chips">`
       + evidence.map(n => `<code class="jump" data-n="${e(n)}">${e(n)}</code>`).join('') + '</span></div>';
  if (c.note) h += `<p class="why">${inlineTex(c.note)}</p>`;
  return h + '</div>';
}
function correspondenceLane(row){
  let h = '';
  if (row.sourceInterpretation === 'nonlocal')
    h += `<div class="note"><b>Nonlocal reading.</b> This row is read under source material outside the `
       + `cited passage. ${row.nonlocalRationale ? inlineTex(row.nonlocalRationale) : ''}</div>`;
  else if (row.sourceInterpretation === 'local')
    h += `<div class="note info"><b>Local reading.</b> Every hypothesis and conclusion below is printed in the cited passage.</div>`;
  const edges = row.edges || [];
  if (!edges.length) return h + '<p class="empty">No clause-level correspondence is recorded for this row.</p>';
  const byKind = {};
  for (const c of edges) (byKind[c.kind || ''] ||= []).push(c);
  for (const kind of KIND_ORDER) {
    const list = byKind[kind];
    if (!list) continue;
    if (kind) h += `<div class="kindhead">${e(kind)}</div>`;
    h += list.map(c => clauseCard(c, row.id, row.uncurated)).join('');
  }
  if (row.note) h += `<div class="note info"><b>Review note.</b> ${inlineTex(row.note)}</div>`;
  if (row.nextAction) h += `<div class="note"><b>Next action.</b> ${inlineTex(row.nextAction)}</div>`;
  return h;
}

  if (!r) return `<li>${v}<code>${e(name)}</code> <span class="k2">(no record)</span></li>`;
  if (r.missing) return `<li>${v}<code>${e(name)}</code> <span class="k2">(not in environment)</span></li>`;
  if (seen.has(name)) return `<li>${v}<code>${e(name)}</code> <span class="k2">(above)</span></li>`;
  seen.add(name);
  const kind = (r.flags||[]).includes('class') ? 'class' : (r.flags||[]).includes('structure') ? 'structure' : r.kind;
  if (r.boundary && depth > 0)
    return `<li>${v}<code>${e(name)}</code> <span class="k2">(${e(kind)}, ${e(r.library||'')})</span></li>`;
  let h = `<li>${v}<code>${e(name)}</code> <span class="k2">(${e(kind)}, ${e(r.module)}:${r.line||''})</span>`;
  h += `<details${depth<2?' open':''}><summary>signature</summary><pre>${leanHl(r.signature||r.type||'')}</pre>`;
  if (r.fields && r.fields.length)
    h += '<ul>' + r.fields.map(f => `<li><code>${e(f.name)}</code> : <code>${e((f.type||'').replace(/\s+/g,' '))}</code></li>`).join('') + '</ul>';

      + ` · printed-type hash <code>${e(((d.hashes||{}).text||'').slice(0,16))}</code>`

/* A presentation form is a second Lean spelling of the same result, restated so

const RELWORD = {

         + `<code class="jump" data-n="${e(v.via)}">${e(v.via)}</code>${at ? `, ${at.trim()} from here` : ''}.</li>`;

         + `graph shows neither a path between them nor a shared proof core.</li>`;

/* ---- rows -------------------------------------------------------------- */

    + `<h2>${e(row.title)} ${badges}</h2>`
    + `<div class="meta">${e(row.paper)} · <code>${e(row.id)}</code>`
    + (row.sourceAnchor ? ` · ${e(row.sourceAnchor)}` : '') + '</div>'

/* Rows are built on demand: a page with every lane of every row expanded

const ROWS = {};
function openRow(section, open){
  const row = ROWS[section.dataset.id];

/* ---- interaction ------------------------------------------------------- */
function clearMarks(scope){
  scope.querySelectorAll('mark[data-auto]').forEach(m => {
    const t = document.createTextNode(m.textContent);
    m.replaceWith(t);
  });
  scope.querySelectorAll('.card.hit,.decl.hit').forEach(x => x.classList.remove('hit'));
}
/* Highlight a quoted excerpt inside the rendered passage.  The quote is
   compared on collapsed whitespace, because the fragment is reflowed prose. */
/* The same folding the validator applies: a quote copied out of the TeX and a
   quote copied off the page have to match the same passage. */
function fold(s){
  return s.replace(/[\u2013\u2014]/g,'-').replace(/[\u00a0~]/g,' ')
          .replace(/[\u201c\u201d]/g,'"').replace(/\u2019/g,"'")
          .replace(/--/g,'-').replace(/\s+/g,' ').toLowerCase();

function markExcerpt(card, excerpt){

  if (bodies.length) {
    const visible = bodies.find(b => !b.hidden) || bodies[0];
    if (markIn(visible, excerpt)) return true;
    for (const body of bodies) {
      if (body === visible) continue;
      if (!markIn(body, excerpt)) continue;
      const button = card.querySelector(`.rendition[data-rendition="${body.dataset.rendition}"]`);

    if (node.parentElement.closest('.katex, .hash, h4')) continue;
    nodes.push(node);

    const lanes = h.closest('.lanes');
    const cls = 'wide-' + h.dataset.lane;

    ev.stopPropagation();

    card.querySelectorAll('.renditionBody').forEach(x => {

/* ---- page -------------------------------------------------------------- */
document.getElementById('title').textContent = P.title;
const meta = [];
if (P.statementMeta && P.statementMeta.toolchain) meta.push('toolchain ' + P.statementMeta.toolchain);
if (P.graph) meta.push('proof graph: ' + P.graph.nodeCount + ' declarations');
const docs = ((P.sources||{}).documents)||[];
if (docs.length) meta.push(docs.length + ' source document(s)');
if (P.includesPrivate) meta.push('LOCAL MODE: private source text included');
if (!HAVE_KATEX) meta.push('math renderer unavailable; showing TeX');
document.getElementById('subtitle').textContent = meta.join(' · ');

const rowsEl = document.getElementById('rows'), navEl = document.getElementById('nav'),
      q = document.getElementById('search'), triageEl = document.getElementById('triage');

/* ---- triage -----------------------------------------------------------
   A reviewer opening this page wants one question answered first: what,
   if anything, needs attention. Scrolling every row to find out is the
   thing the page was worst at, so the facets below both count and filter.
   `certified` is deliberately not the first chip: an audit browser should
   lead with what is unresolved. */
const FACETS = [
  {key: 'blocked',   label: 'semantic review not accepted', alarm: true,
   test: r => r.certification && r.certification.semantic
              && r.certification.semantic !== 'accepted'},
  {key: 'open',      label: 'reviewed clause not established', alarm: true,
   test: r => !r.uncurated && (r.edges || []).some(c => c.status === 'open')},
  {key: 'uncurated', label: 'no curated correspondence',
   test: r => !!r.uncurated},
  {key: 'drift',     label: 'statement pin moved', alarm: true,
   test: r => r.pinSummary === 'drift' || r.pinSummary === 'text-drift'},
  {key: 'sourcedrift', label: 'source passage moved', alarm: true,
   test: r => r.sourcePinSummary === 'moved' || r.sourcePinSummary === 'unresolved'},
  {key: 'unpinned',  label: 'unpinned',
   test: r => r.pinSummary === 'unpinned' || r.sourcePinSummary === 'unpinned'},
  {key: 'nonlocal',  label: 'nonlocal reading',
   test: r => r.sourceInterpretation === 'nonlocal'},

const active = new Set();

  const chips = FACETS.map(f => {

    if (!n && !active.has(f.key)) return '';
    const cls = (f.alarm ? 'alarm ' : f.clean ? 'clean ' : '') + (active.has(f.key) ? 'on' : '');
    return `<button class="${cls}" data-facet="${e(f.key)}" `
         + `aria-pressed="${active.has(f.key)}">${e(f.label)}<span class="count">${n}</span></button>`;
  }).filter(Boolean).join('');
  const clean = FACETS.filter(f => f.alarm).every(f => !rows.some(f.test));
  triageEl.innerHTML =
    `<span class="lead">${rows.length} row(s)${clean ? ' · nothing outstanding' : ''}</span>` + chips
    + (active.size ? '<button data-facet="__clear">clear filters</button>' : '');
  triageEl.querySelectorAll('button[data-facet]').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.dataset.facet;
      if (k === '__clear') active.clear();
      else active.has(k) ? active.delete(k) : active.add(k);
      render();
    }));
}
function passesFacets(r){
  if (!active.size) return true;
  return FACETS.some(f => active.has(f.key) && f.test(r));
}
function render(){
  const needle = q.value.toLowerCase();
  rowsEl.innerHTML = ''; navEl.innerHTML = '';
  renderTriage();
  let firstId = null;
  for (const paper of P.papers) {
    const rows = paper.rows.filter(r => passesFacets(r))
      .filter(r => !needle || JSON.stringify(r).toLowerCase().includes(needle));
    if (!rows.length) continue;
    navEl.insertAdjacentHTML('beforeend', `<h3>${e(paper.title)}</h3>`);
    for (const r of rows) {
      ROWS[r.id] = r;
      firstId ||= r.anchor;
      navEl.insertAdjacentHTML('beforeend',
        `<a data-anchor="${e(r.anchor)}">${e(r.title)}</a>`);
      rowsEl.insertAdjacentHTML('beforeend', rowShell(r));
    }
  }
  rowsEl.querySelectorAll('section.row>h2').forEach(h => h.addEventListener('click', () => {
    const s = h.parentElement;
    openRow(s, s.classList.contains('closed'));
    if (!s.classList.contains('closed')) location.hash = s.id;
  }));
  navEl.querySelectorAll('a').forEach(a => a.addEventListener('click', () => show(a.dataset.anchor)));
  if (!firstId) {
    rowsEl.innerHTML = '<section class="row"><h2>No row matches</h2>'
      + '<div class="meta">Clear the filters or the search box to see the rest.</div></section>';
    return;
  }
  const wanted = decodeURIComponent(location.hash.replace(/^#/,'')) || firstId;
  if (wanted) show(wanted, false);
}
function show(anchor, scroll = true){
  const s = document.getElementById(anchor);
  if (!s) return;
  openRow(s, true);
  navEl.querySelectorAll('a').forEach(a => a.classList.toggle('sel', a.dataset.anchor === anchor));
  if (scroll) s.scrollIntoView({behavior:'smooth', block:'start'});
}
q.addEventListener('input', render);
addEventListener('hashchange', () => show(decodeURIComponent(location.hash.replace(/^#/,''))));
render();
</script></body></html>
